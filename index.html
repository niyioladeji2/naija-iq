<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-column "danfo ride" — checker-striped bus band on top; home = daily ticket + free ride; play = bus-stop route */
/* Palette: soft warm paper + muted Nigerian green + gentle danfo mustard; dark mode is a calm charcoal with the same hues dimmed */
:root{
  --bg:#F6F2E9; --surface:#FFFDF8; --sunk:#EFE9DC; --ink:#2C2B27; --muted:#6F6A5D;
  --line:#E2DACA; --edge:#CFC6B2;
  --accent:#2F7A5B; --accent-ink:#FFFFFF; --accent-deep:#24614A; --accent-soft:#DCEBE2;
  --danfo:#E9C46A; --danfo-soft:#F5E7BF; --band:#EDD08A; --band-ink:#2C2B27; --title:#24614A; --checker:#2C2B27;
  --wrong:#B5573F; --wrong-ink:#FFFFFF; --wrong-soft:#F4DDD5;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191A17; --surface:#22241F; --sunk:#1D1F1B; --ink:#E8E4D8; --muted:#A39E8E;
  --line:#33362F; --edge:#45493F;
  --accent:#6DBE96; --accent-ink:#10231A; --accent-deep:#4C9874; --accent-soft:#24362C;
  --danfo:#D2AE55; --danfo-soft:#3A3323; --band:#23251F; --band-ink:#E8E4D8; --title:#D9B75E; --checker:#D2AE55;
  --wrong:#E08B74; --wrong-ink:#2A120C; --wrong-soft:#3D2721; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191A17; --surface:#22241F; --sunk:#1D1F1B; --ink:#E8E4D8; --muted:#A39E8E;
  --line:#33362F; --edge:#45493F;
  --accent:#6DBE96; --accent-ink:#10231A; --accent-deep:#4C9874; --accent-soft:#24362C;
  --danfo:#D2AE55; --danfo-soft:#3A3323; --band:#23251F; --band-ink:#E8E4D8; --title:#D9B75E; --checker:#D2AE55;
  --wrong:#E08B74; --wrong-ink:#2A120C; --wrong-soft:#3D2721; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.band{background:var(--band);color:var(--band-ink)}
.band .checker{opacity:.9}
.band-inner{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.checker{height:14px;background:
  repeating-linear-gradient(90deg,var(--checker) 0 14px,transparent 14px 28px) 0 0/28px 7px repeat-x,
  repeating-linear-gradient(90deg,transparent 0 14px,var(--checker) 14px 28px) 0 7px/28px 7px repeat-x;background-color:var(--band);opacity:.85}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.75rem,7vw,2.7rem);line-height:.95;margin:6px 0 0;text-wrap:balance}
h1 span{color:var(--title)}
.band.compact h1{font-size:clamp(1.2rem,5vw,1.5rem)}
.band.compact h1 span{display:inline}
.band.compact .eyebrow{display:none}
.bandctl{display:flex;gap:8px;align-self:flex-start;margin-top:2px}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;padding:0;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1.5px solid color-mix(in srgb,var(--band-ink) 30%,transparent);color:var(--band-ink);border-radius:50%;cursor:pointer}
.iconbtn:hover{background:var(--surface)}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.1}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;gap:18px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{font:inherit;font-family:var(--display);font-size:19px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:13px 24px;cursor:pointer;box-shadow:0 3px 0 var(--accent-deep);transition:filter .15s;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--edge);box-shadow:none;font-size:16px;padding:10px 18px}
.btn.small{font-size:16px;padding:9px 16px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}

/* daily ticket */
.ticket{background:var(--surface);border:1.5px solid var(--edge);border-radius:16px;box-shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px -12px rgb(0 0 0 / .18);padding:18px;display:grid;gap:12px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--edge);transform:translateY(-50%)}
.ticket::before{left:-11px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-11px;clip-path:inset(0 50% 0 0)}
.ticket h2{font-size:26px}
.grid{font-size:22px;letter-spacing:2px;line-height:1.2;word-break:break-all}
.flame{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--danfo-soft);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.countdown{font-variant-numeric:tabular-nums}

/* level */
.level{display:grid;gap:6px}
.lvbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cat{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:0}
.cat b{font-weight:800;font-size:16px}
.cat small{color:var(--muted);font-size:12.5px;line-height:1.3}
.cat:hover{border-color:var(--accent);background:var(--sunk)}
.cat,.opt,.chip{transition:border-color .15s,background-color .15s}
.cat.mix{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.cat.mix small{color:var(--muted)}

/* play */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.topbar .score{font-family:var(--display);font-size:20px}
.route{display:flex;align-items:center;margin:2px 6px 0 0}
.stop{flex:1;height:4px;background:var(--line);position:relative}
.stop::after{content:"";position:absolute;right:-6px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line);box-sizing:border-box}
.stop.ok{background:var(--accent)}.stop.ok::after{border-color:var(--accent);background:var(--accent)}
.stop.bad{background:var(--wrong)}.stop.bad::after{border-color:var(--wrong);background:var(--wrong)}
.stop.now::after{border-color:var(--accent);background:var(--danfo)}
.timer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.timer .bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--danfo);border-radius:999px;transform-origin:left;transition:transform 1s linear}
.timer.low .fill{background:var(--wrong)}
.timer .secs{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.q{font-size:clamp(1.25rem,5vw,1.65rem);font-weight:800;line-height:1.25;margin:8px 0 0;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:17px;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px}
.opt .k{font-family:var(--display);font-size:14px;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--danfo-soft);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--sunk)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt.correct{border-color:var(--accent);background:var(--accent-soft);opacity:1;text-decoration:none}
.opt.correct .k{background:var(--accent);color:var(--accent-ink)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.wrong .k{background:var(--wrong);color:var(--wrong-ink)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:800;background:var(--surface);color:var(--ink);border:1.5px solid var(--edge);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.streak{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.streak.hot{color:var(--wrong)}
.fact{background:var(--surface);border:1.5px dashed var(--edge);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.fact .verdict{font-family:var(--display);font-size:20px;margin:0}
.fact p{margin:0}
.fact .verdict.ok{color:var(--accent)}.fact .verdict.bad{color:var(--wrong)}
.after{display:grid;gap:12px}
.after .btn{justify-self:stretch}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.leave{background:var(--surface);border:1.5px solid var(--edge);border-radius:12px;padding:14px;display:grid;gap:10px}

/* results */
.result{background:var(--surface);border:1.5px solid var(--edge);border-radius:16px;padding:20px;display:grid;gap:6px;box-shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px -12px rgb(0 0 0 / .18)}
.big{font-family:var(--display);font-size:clamp(3rem,16vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;color:var(--muted)}
.rank{font-size:22px;font-weight:800;margin:0}
.share{display:grid;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.share pre{margin:0;font-family:var(--body);font-size:15px;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:12px;user-select:all}
.field{display:grid;gap:6px}
.field input{font:inherit;font-size:17px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;flex:1 1 180px}
.review{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.review li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.review .dot{width:14px;height:14px;border-radius:50%;margin-top:5px}
.review small{display:block;color:var(--muted)}
details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:800}

/* leaderboard */
.board{display:grid;gap:10px}
.tabs{display:inline-flex;border:1.5px solid var(--edge);background:var(--surface);border-radius:999px;overflow:hidden}
.tabs button{font:inherit;font-weight:800;font-size:14px;background:transparent;color:var(--ink);border:none;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.lb{margin:0;padding:0;list-style:none;border:1.5px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--surface)}
.lb li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb li:first-child{border-top:none}
.lb .pos{font-family:var(--display);font-size:16px;color:var(--muted)}
.lb li.top .pos{color:var(--ink)}
.lb li.top{background:var(--danfo-soft)}
.lb .who{min-width:0;overflow-wrap:anywhere}
.lb .who b{font-weight:800}
.lb .who small{display:block;color:var(--muted);font-size:13px}
.lb .p{font-family:var(--display);font-size:17px}
.lb li.me{outline:2px solid var(--accent);outline-offset:-2px}
.lb .empty{display:block;padding:14px;color:var(--muted);grid-column:1/-1}


/* home: stats strip, mix button, category pills, how-to */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.stat b{font-size:17px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:12.5px}
.stat .label{font-size:11px}
.stat .lvbar{display:block;height:6px;margin:5px 0 2px}
.free{display:grid;gap:12px}
.mixbtn{font:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--accent-soft);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,filter .15s}
.mixbtn b{display:block;font-size:18px;font-weight:800}
.mixbtn small{color:var(--muted);font-size:13.5px}
.mixbtn .arrow{font-size:22px;color:var(--accent);flex:none}
.mixbtn:hover{border-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:15px;font-weight:600;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background-color .15s}
.pill:hover{border-color:var(--accent);background:var(--sunk)}
.howto ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.linkbtn{font:inherit;font-weight:800;background:none;border:none;color:var(--accent);cursor:pointer;justify-self:start;padding:4px 0}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.ownerbox{display:grid;gap:10px;border-top:1.5px dashed var(--edge);padding-top:18px}
.stats.owner .stat b{font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:no-preference){
 .pop{animation:pop .3s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
 .shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
}
@media (prefers-reduced-motion:reduce){.timer .fill{transition:none}}
</style>

<div class="band" id="band">
  <div class="band-inner">
    <div>
      <div class="eyebrow">You think you know Naija?</div>
      <h1>Naija <span>IQ</span></h1>
    </div>
    <div class="bandctl"><button class="iconbtn" id="theme" aria-label="Colour theme"></button><button class="iconbtn" id="sound" aria-pressed="true" aria-label="Sound"></button></div>
  </div>
  <div class="checker" aria-hidden="true"></div>
</div>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const Q = [
 // PLACES
 {c:"Places",q:"Which city replaced Lagos as Nigeria's capital in 1991?",a:"Abuja",o:["Ibadan","Kaduna","Lokoja"],f:"Abuja was planned from scratch, partly because it sits close to the centre of the country."},
 {c:"Places",q:"Which state proudly calls itself the \"Centre of Excellence\"?",a:"Lagos",o:["Ogun","Rivers","Oyo"],f:"You'll see \"Centre of Excellence\" on Lagos plate numbers."},
 {c:"Places",q:"Which state is nicknamed the \"Coal City State\"?",a:"Enugu",o:["Kogi","Anambra","Benue"],f:"Coal was mined around Enugu from the early 1900s, and the city grew around it."},
 {c:"Places",q:"Port Harcourt's popular nickname is…",a:"The Garden City",o:["The Oil City","The River City","The Palm City"],f:"PH earned \"Garden City\" for its parks and greenery in colonial times."},
 {c:"Places",q:"At Lokoja, the River Niger meets which river?",a:"Benue",o:["Kaduna","Sokoto","Cross River"],f:"The confluence forms a Y shape, and Lokoja was once the colonial capital."},
 {c:"Places",q:"Calabar is the capital of which state?",a:"Cross River",o:["Akwa Ibom","Rivers","Bayelsa"],f:"Calabar is also famous for edikang ikong and afang soup."},
 {c:"Places",q:"Cocoa House, once the tallest building in tropical Africa, is in which city?",a:"Ibadan",o:["Lagos","Akure","Abeokuta"],f:"It was funded by cocoa farming revenue and completed in 1965."},
 {c:"Places",q:"Plateau State's slogan is…",a:"Home of Peace and Tourism",o:["Food Basket of the Nation","Land of Promise","Gateway State"],f:"Jos sits around 1,200 m up, which is why the weather is cooler there."},
 {c:"Places",q:"\"Made in Aba\" is famous for what?",a:"Shoes, bags and clothing",o:["Palm wine","Cars","Pottery"],f:"Aba's Ariaria market is one of West Africa's biggest trading hubs."},
 {c:"Places",q:"Which ancient city is known for its old walls and the Kofar Mata dye pits?",a:"Kano",o:["Zaria","Bauchi","Maiduguri"],f:"The Kofar Mata dye pits have been used for indigo dyeing for centuries."},

 // SLANG
 {c:"Slang",q:"Your guy says he wants to \"japa\". What's his plan?",a:"Relocate abroad",o:["Run from a fight","Start a business","Get married"],f:"Japa comes from Yoruba for \"run, flee\", and became the word for emigrating."},
 {c:"Slang",q:"\"Sapa don hold me\" means…",a:"I'm broke",o:["I'm hungry","I'm sick","I'm in love"],f:"Sapa is the end-of-month dryness of the pocket."},
 {c:"Slang",q:"\"Wahala\" means…",a:"Trouble",o:["Party","Money","Sleep"],f:"\"No wahala\" means no problem."},
 {c:"Slang",q:"An \"owambe\" is…",a:"A big, lavish party",o:["A night bus","A market stall","A church service"],f:"Think aso-ebi, jollof, live band and plenty spraying of money."},
 {c:"Slang",q:"If something \"get K-leg\", it is…",a:"Suspicious or not quite right",o:["Very fast","Very expensive","Newly bought"],f:"Like a leg that's bent: something isn't straight about the matter."},
 {c:"Slang",q:"\"Gbas gbos\" describes…",a:"A fight or exchange of blows",o:["Loud music","Heavy rain","Fast driving"],f:"The sound effect of trading punches, in two syllables."},
 {c:"Slang",q:"\"Abeg\" means…",a:"Please",o:["Thank you","Come here","Hurry up"],f:"Used for begging, and also for \"abeg, leave me\"."},
 {c:"Slang",q:"Someone \"dey form shakara\". They are…",a:"Showing off or playing hard to get",o:["Very tired","Telling lies","Cooking"],f:"Fela even has a song titled Shakara."},
 {c:"Slang",q:"\"Wetin dey happen?\" means…",a:"What's going on?",o:["Where are you going?","How much is it?","Who sent you?"],f:"Pidgin English unites Nigerians across more than 500 languages."},
 {c:"Slang",q:"\"Chop life\" means…",a:"Enjoy life",o:["Eat too much","Waste time","Work hard"],f:"In pidgin, \"chop\" is to eat, and also to enjoy or spend."},

 // SIGHTS

function beep(freqs,dur=.12,type="triangle"){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
    freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.8})}catch(e){}
}

/* ---------- confetti (green-white-green) ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue("--accent").trim(),"#FFFFFF",cs.getPropertyValue("--accent").trim(),cs.getPropertyValue("--danfo").trim()];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:5+Math.random()*6,r:Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle="rgba(0,0,0,.25)";x.lineWidth=.5;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<180)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

let playWrite=Promise.resolve();
function trackPlay(kind){
  if(!db||!me)return;
  playWrite=playWrite.then(async()=>{
    try{
      const ref=db.collection("plays").doc(me);const snap=await ref.get();const p=snap.exists?snap.data():{};
      const now=Date.now();
      const next={first:p.first||now,last:now,lastDate:today,visits:(p.visits||0)+(kind==="visit"?1:0),rides:(p.rides||0)+(kind==="ride"?1:0),dailies:(p.dailies||0)+(kind==="daily"?1:0)};
      if(kind==="daily")next.rides+=1;
      await ref.set(next);
    }catch(e){}
  });
}

  const week=Date.now()-7*864e5,active7=plays.filter(p=>(p.last||0)>=week).length;

  else if(boardState==="off")body=`<li><span class="empty">Sign in to Claude with access to this game to see the leaderboard.</span></li>`;
  else if(!rows.length)body=`<li><span class="empty">${boardTab==="today"?"Nobody has played today's Daily yet. Be the first.":"No scores yet. Finish a free ride to get on the board."}</span></li>`;
  else body=rows.slice(0,boardLimit).map((r,k)=>`<li class="${r.id===me?"me ":""}${k===0?"top":""}"><span class="pos">${k+1}</span><span class="who"><b>${esc(r.nick||"Anonymous")}</b><small>${esc(r.correct)}/10${boardTab==="today"?(r.streak>1?` · ${esc(r.streak)}-day streak`:""):` · ${esc(catName(r.cat))}`}</small></span><span class="p">${fmt(r.points)}</span></li>`).join("");
  return `<div class="spread"><h2>Leaderboard</h2><div class="tabs" role="tablist"><button role="tab" id="tab-today" aria-selected="${boardTab==="today"}" data-t="today">Today</button><button role="tab" id="tab-all" aria-selected="${boardTab==="all"}" data-t="all">All-time</button></div></div><ol class="lb">${body}</ol>${rows.length>boardLimit?`<button class="linkbtn" id="moreBoard">Show top ${Math.min(rows.length,20)}</button>`:""}`;
}
function paintBoard(){const el=$("board");if(!el)return;if(window.STANDALONE){el.hidden=true;return}el.innerHTML=boardHTML();el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{boardTab=b.dataset.t;paintBoard()});const m=$("moreBoard");if(m)m.onclick=()=>{boardLimit=20;paintBoard()}}
async function postScore(){
  if(!db||!me)return "off";
  const name=(nick||"Anonymous").slice(0,24);
  try{
    if(run.mode==="daily"){
      await db.collection("daily").doc(me).set({nick:name,date:today,correct:run.correct,points:run.points,grid:run.grid,streak:currentStreak(),at:Date.now()});
      return "saved";
    }
    const ref=db.collection("scores").doc(me);
    const snap=await ref.get();const prev=snap.exists?snap.data():null;
    if(prev&&prev.points>=run.points){if(prev.nick!==name)await ref.update({nick:name});return "kept"}
    await ref.set({nick:name,points:run.points,correct:run.correct,cat:run.cat,at:Date.now()});
    return "saved";
  }catch(e){return "failed"}
}

/* ---------- game state ---------- */
let view="home",run=null,tick=null,left=SECS,locked=false,paused=false;
function setBand(compact){$("band").classList.toggle("compact",compact)}
function stopTimer(){if(tick){clearInterval(tick);tick=null}}

function dailyQuestions(){
  const r=rng(hashStr("naija-daily-"+today));
  const cats=shuffle(CATS.map(c=>c.id),r).slice(0,LEN);
  return cats.map(cid=>{const pool=Q.filter(x=>x.c===cid);const x=pool[Math.floor(r()*pool.length)];return {...x,opts:shuffle([x.a,...x.o],r)}});
}
function freeQuestions(cat){
  const pool=cat==="All"?Q:Q.filter(x=>x.c===cat);
  const key=cat;let s=new Set(seen[key]||[]);
  let fresh=pool.filter(x=>!s.has(x.q));
  if(fresh.length<LEN){s=new Set();fresh=pool}
  const pick=shuffle(fresh).slice(0,LEN);
  pick.forEach(x=>s.add(x.q));seen[key]=[...s];store.set("naija-seen",seen);
  return pick.map(x=>({...x,opts:shuffle([x.a,...x.o])}));
}

/* ---------- screens ---------- */
function home(){
  view="home";stopTimer();setBand(false);
  const lv=level(),st=currentStreak(),done=dailyDone&&dailyDone.date===today;
  app.innerHTML=`
   <section class="ticket pop">
     <span class="label">Daily Naija · #${dayNo}</span>
     ${done?`
       <h2>You've done today's ride</h2>
       <div class="grid" aria-label="Your answers today">${esc(dailyDone.grid)}</div>
       <div class="muted">${dailyDone.correct}/10 · ${fmt(dailyDone.points)} pts · next Daily in <span class="countdown" id="cd"></span></div>
       <div class="row"><button class="btn small" id="shareDaily">Share my result</button><button class="btn ghost" id="toFree">Free ride</button></div>`
     :`
       <h2>Today's 10 questions</h2>
       <p class="muted" style="margin:0">Same questions for everyone today. One try only.</p>
       <button class="btn" id="playDaily">Play today's Daily</button>`}
   </section>

   <section class="stats" aria-label="Your progress">
     <div class="stat"><span class="label">Streak</span><b>${st?`🔥 ${st}`:"0"}</b><small>${st===1?"day":"days"} in a row</small></div>
     <div class="stat"><span class="label">Level</span><b>${esc(lv.name)}</b><span class="lvbar" aria-hidden="true"><i style="width:${Math.max(lv.pct,4)}%"></i></span><small>${lv.next?`${lv.toGo} to next level`:"Top level"}</small></div>
     <div class="stat"><span class="label">Best ride</span><b>${fmt(bestFree)}</b><small>points</small></div>
   </section>

   <section id="free" class="free">
     <div class="spread"><h2>Free ride</h2><span class="muted" style="font-size:14px">10 questions, as often as you like</span></div>
     <button class="mixbtn" data-c="All" id="cat-All"><span><b>Mix am</b><small>Questions from all ${CATS.length} categories</small></span><span class="arrow" aria-hidden="true">→</span></button>
     <span class="label">Or pick a category</span>
     <div class="pills">${CATS.map(c=>`<button class="pill" id="cat-${c.id}" data-c="${c.id}" title="${esc(c.note)}">${esc(c.name)}</button>`).join("")}</div>
   </section>

   <details class="howto"><summary>How to play</summary>
     <ul>
       <li>Each ride has 10 questions and ${SECS} seconds per question.</li>
       <li>Every correct answer earns 100 points, plus 5 for each second left.</li>
       <li>Answer correctly in a row to build a streak bonus of up to 200 points.</li>
       <li>Use your one 50:50 per ride to remove two wrong answers.</li>
       <li>Play the Daily every day to grow your 🔥 streak.</li>
     </ul>
   </details>

   <section class="board" id="board"></section>
   <section class="ownerbox" id="owner" hidden></section>`;
  boardLimit=5;paintBoard();paintOwner();
  if(done){
    $("shareDaily").onclick=()=>{const t=shareText(dailyDone);if(window.STANDALONE&&navigator.share)navigator.share({text:t}).catch(()=>{});else copyText(t)};
    $("toFree").onclick=()=>$("free").scrollIntoView({behavior:"smooth"});
    const cd=$("cd");const upd=()=>{if(!document.body.contains(cd))return clearInterval(iv);const ms=msToLagosMidnight();const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);cd.textContent=`${h}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`};const iv=setInterval(upd,1000);upd();
  }else $("playDaily").onclick=()=>start("daily");
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>start("free",b.dataset.c));
}

function start(mode,cat="All"){
  if(mode==="daily"&&dailyDone&&dailyDone.date===today)return home();
  run={mode,cat:mode==="daily"?"Daily":cat,qs:mode==="daily"?dailyQuestions():freeQuestions(cat),i:0,correct:0,points:0,streak:0,best:0,log:[],grid:"",fifty:true};
  setBand(true);window.scrollTo({top:0});ask();
}
function route(){return `<div class="route" aria-label="Stop ${run.i+1} of ${run.qs.length}">${run.qs.map((_,k)=>`<div class="stop ${k<run.log.length?(run.log[k].ok?"ok":"bad"):(k===run.i?"now":"")}"></div>`).join("")}</div>`}
function paintTimer(){const t=$("timer");if(!t)return;t.querySelector(".fill").style.transform=`scaleX(${left/SECS})`;t.querySelector(".secs").textContent=left+"s";t.classList.toggle("low",left<=5)}
function startTimer(){stopTimer();tick=setInterval(()=>{if(paused)return;left--;paintTimer();if(left<=5&&left>0)sfx.tick();if(left<=0)pick(null)},1000)}
function ask(){
  view="play";locked=false;paused=false;left=SECS;const x=run.qs[run.i];
  app.innerHTML=`
   <div class="topbar"><button class="chip" id="quit" aria-label="Leave this ride">✕ Leave</button><span class="label">${run.mode==="daily"?`Daily #${dayNo}`:esc(catName(run.cat))} · Stop ${run.i+1}/${run.qs.length}</span><span class="score" id="pts">${fmt(run.points)}</span></div>
   ${route()}
   <div class="timer" id="timer" role="timer" aria-label="Time left"><div class="bar"><div class="fill"></div></div><span class="secs">${SECS}s</span></div>
   <div id="leaveBox"></div>
   <div class="pop"><span class="tag">${esc(catName(x.c))}</span><p class="q">${esc(x.q)}</p></div>
   <div class="opts" id="opts">${x.opts.map((o,k)=>`<button class="opt" id="opt-${k}" data-v="${esc(o)}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div class="tools"><button class="chip" id="fifty" ${run.fifty?"":"disabled"}>50:50</button><span class="streak ${run.streak>=3?"hot":""}" id="streak">${run.streak>=2?`🔥 ${run.streak} in a row`:"Build a streak for bonus points"}</span></div>
   <div id="after" class="after"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  $("fifty").onclick=useFifty;
  $("quit").onclick=askLeave;
  startTimer();
}
function useFifty(){
  if(!run.fifty||locked)return;run.fifty=false;$("fifty").disabled=true;
  const x=run.qs[run.i];const wrong=shuffle([...app.querySelectorAll(".opt")].filter(o=>o.dataset.v!==x.a)).slice(0,2);
  wrong.forEach(o=>{o.disabled=true;o.classList.add("gone")});sfx.tick();
}
function askLeave(){
  if(locked&&run.i===run.qs.length-1){return home()}
  paused=true;
  $("leaveBox").innerHTML=`<div class="leave pop"><b>Leave this ride?</b><span class="muted">${run.mode==="daily"?"Your Daily will count as finished with the score you have now.":"Your progress in this ride will be lost."}</span><div class="row"><button class="btn small" id="stay">Keep playing</button><button class="btn ghost" id="go">Leave</button></div></div>`;
  $("stay").onclick=()=>{$("leaveBox").innerHTML="";paused=false};
  $("go").onclick=()=>{stopTimer();if(run.mode==="daily"){while(run.log.length<run.qs.length){run.log.push({q:run.qs[run.log.length].q,a:run.qs[run.log.length].a,pick:null,ok:false});run.grid+="⬛"}done()}else home()};
}
function pick(b){
  if(locked)return;locked=true;stopTimer();
  const x=run.qs[run.i],chosen=b?b.dataset.v:null,ok=chosen===x.a;
  let gained=0,bonus=0;
  if(ok){run.streak++;run.best=Math.max(run.best,run.streak);bonus=run.streak>=2?Math.min((run.streak-1)*50,200):0;gained=100+left*5+bonus;run.correct++;run.points+=gained;xp++;store.set("naija-xp",xp);sfx.ok()}
  else{run.streak=0;sfx.bad()}
  run.grid+=ok?"🟩":(b?"🟥":"⏱️");
  run.log.push({q:x.q,a:x.a,pick:chosen,ok});
  app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.v===x.a)o.classList.add("correct")});
  if(b&&!ok){b.classList.add("wrong","shake")}
  $("fifty").disabled=true;
  $("pts").textContent=fmt(run.points);
  app.querySelector(".route").outerHTML=route();
  const sk=$("streak");sk.className="streak "+(run.streak>=3?"hot":"");sk.textContent=run.streak>=2?`🔥 ${run.streak} in a row`:(ok?"Nice one":"Streak reset");
  const last=run.i===run.qs.length-1;
  const verdict=ok?`Correct! +${gained}${bonus?` (incl. ${bonus} streak bonus)`:""}`:(b?"Ah ah! E no reach.":"Time don waka!");
  $("after").innerHTML=`
   <div class="fact pop"><p class="verdict ${ok?"ok":"bad"}">${verdict}</p>${ok?"":`<p><b>Answer:</b> ${esc(x.a)}</p>`}<p>${esc(x.f)}</p></div>
   <button class="btn" id="next">${last?"See my result":"Next stop →"}</button>
   <p class="hint">Tip: press Enter for next, or 1–4 to answer</p>`;
  const n=$("next");n.focus({preventScroll:true});n.scrollIntoView({behavior:"smooth",block:"nearest"});
  n.onclick=()=>{if(last)done();else{run.i++;ask();window.scrollTo({top:0,behavior:"smooth"})}};
}
document.addEventListener("keydown",e=>{
  if(view!=="play"||e.target.tagName==="INPUT")return;
  if(!locked&&/^[1-4a-dA-D]$/.test(e.key)){const k=/[1-4]/.test(e.key)?+e.key-1:"abcd".indexOf(e.key.toLowerCase());const b=$("opt-"+k);if(b&&!b.disabled)pick(b)}
  else if(locked&&e.key==="Enter"&&document.activeElement?.id!=="next"){$("next")?.click()}
});

function shareText(r){return shareTextBase(r)+(window.STANDALONE?"\n"+location.origin+location.pathname:"")}
function shareTextBase(r){
  const head=r.mode==="free"?`Naija IQ · ${catName(r.cat)}`:`Naija IQ · Daily #${dayNo}`;
  const st=r.streak>1?` · 🔥 ${r.streak}-day streak`:"";
  return `${head}\n${r.grid}\n${r.correct}/10 · ${fmt(r.points)} pts${r.mode==="free"?"":st}\n${r.correct>=9?"Naija to the bone! Can you beat me?":"Your Naija IQ pass mine? Try am."}`;
}
async function done(){
  trackPlay(run.mode==="daily"?"daily":"ride");
  view="result";stopTimer();setBand(false);
  const r=RANKS.filter(x=>run.correct>=x[0]).pop();
  if(run.mode==="daily"){
    const n=(dayStreak.last===yesterday?dayStreak.n:(dayStreak.last===today?dayStreak.n-1:0))+1;
    dayStreak={last:today,n};store.set("naija-streak",dayStreak);
    dailyDone={date:today,correct:run.correct,points:run.points,grid:run.grid,streak:n};store.set("naija-daily",dailyDone);
  }else if(run.points>bestFree){bestFree=run.points;store.set("naija-best-free",bestFree)}
  const share=shareText({mode:run.mode,cat:run.cat,grid:run.grid,correct:run.correct,points:run.points,streak:currentStreak()});
  if(run.correct>=9){confetti();sfx.win()}
  app.innerHTML=`
   <div class="result pop">
     <span class="label">${run.mode==="daily"?`Daily Naija #${dayNo}`:`Free ride · ${esc(catName(run.cat))}`}</span>
     <div class="big">${run.correct}<small>/10</small></div>
     <div><b>${fmt(run.points)} points</b>${run.best>=3?` · best streak ${run.best}`:""}</div>
     <p class="rank">${r[1]}</p><p class="muted" style="margin:0">${r[2]}</p>
   </div>
   <div class="share">
     <div class="spread"><b>Share your ride</b><span class="muted" style="font-size:13px">No spoilers, just your grid</span></div>
     <pre id="shareText">${esc(share)}</pre>
     <div class="row"><button class="btn" id="copy">Copy result</button>${window.STANDALONE?`<a class="btn ghost" id="wa" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">WhatsApp</a>${navigator.share?`<button class="btn ghost" id="native">More…</button>`:""}`:""}</div>
   </div>
   <div class="share" id="post" ${window.STANDALONE?"hidden":""}>
     <b>Leaderboard name</b>
     <div class="row"><input id="nick" maxlength="24" placeholder="e.g. Lagos Big Boy" value="${esc(nick)}" autocomplete="nickname" aria-label="Your name on the leaderboard"><button class="btn small" id="postBtn">${nick?"Update name":"Post my score"}</button></div>
     <span class="muted" id="saved" style="font-size:14px">${nick?"Posting your score…":"Add a name to post your score."}</span>
   </div>
   <div class="row">${run.mode==="daily"?`<button class="btn" id="again">Play a free ride</button>`:`<button class="btn" id="again">Play again</button>`}<button class="btn ghost" id="home">Home</button></div>
   <section class="board" id="board"></section>
   <details><summary>Review your answers</summary>
     <ul class="review">${run.log.map(l=>`<li><span class="dot" style="background:var(${l.ok?"--accent":"--wrong"})"></span><span>${esc(l.q)}<small>${l.ok?"You got it: ":"Answer: "}${esc(l.a)}${l.ok?"":(l.pick?" · you said "+esc(l.pick):" · no answer")}</small></span></li>`).join("")}</ul>
   </details>`;
  boardTab=run.mode==="daily"?"today":"all";boardLimit=10;paintBoard();
  $("copy").onclick=()=>copyText(share,$("shareText"));if($("native"))$("native").onclick=()=>navigator.share({text:share}).catch(()=>{});
  $("home").onclick=home;
  $("again").onclick=()=>run.mode==="daily"?(home(),setTimeout(()=>$("free")?.scrollIntoView({behavior:"smooth"}),50)):start("free",run.cat);
  const msg={saved:"You're on the leaderboard.",kept:"Your best score on the all-time board is still higher.",off:"Sign in to Claude with access to this game to post scores.",failed:"Couldn't post. Ask the game's owner to share it with you as a Contributor."};
  const doPost=async()=>{const s=$("saved");s.textContent="Posting…";const res=await postScore();s.textContent=msg[res];$("postBtn").textContent="Update name"};
  $("postBtn").onclick=()=>{const v=$("nick").value.trim();if(!v){$("nick").focus();return}nick=v;store.set("naija-nick",nick);doPost()};
  $("nick").onkeydown=e=>{if(e.key==="Enter")$("postBtn").click()};
  if(nick&&!window.STANDALONE)doPost();
  window.scrollTo({top:0});
}
home();
</script>

<div class="install" id="install" hidden>
  <img src="icons/icon-192.png" alt="" width="44" height="44">
  <div class="install-text"><b>Get the Naija IQ app</b><span id="installHow">Play fast from your home screen, even offline.</span></div>
  <button class="btn small" id="installBtn">Install</button>
  <button class="install-x" id="installX" aria-label="Close">✕</button>
</div>
<style>
.install{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border:1.5px solid var(--edge);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px -10px rgb(0 0 0 / .35)}
.install img{border-radius:10px;flex:none}
.install-text{display:grid;min-width:0;flex:1;font-size:13.5px;line-height:1.35}
.install-text b{font-size:15px}
.install-text span{color:var(--muted)}
.install-x{font:inherit;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px;flex:none}
</style>
<script>
(function(){
  const box=document.getElementById("install"),btn=document.getElementById("installBtn"),how=document.getElementById("installHow");
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  let dismissed=false;try{dismissed=localStorage.getItem("naija-install-x")==="1"}catch(e){}
  if(standalone||dismissed)return;
  const ua=navigator.userAgent;
  const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|Twitter|TikTok|Snapchat/i.test(ua);
  let deferred=null;
  const show=()=>{box.hidden=false};
  document.getElementById("installX").onclick=()=>{box.hidden=true;try{localStorage.setItem("naija-install-x","1")}catch(e){}};
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;how.textContent="Play fast from your home screen, even offline.";btn.textContent="Install";show()});
  window.addEventListener("appinstalled",()=>{box.hidden=true});
  btn.onclick=async()=>{
    if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==="accepted")box.hidden=true;return}
    btn.hidden=true;
  };
  setTimeout(()=>{
    if(deferred)return;
    if(inApp){how.textContent="Open this page in "+(ios?"Safari":"Chrome")+" to install: tap ⋮ or the share icon, then 'Open in browser'.";btn.hidden=true;show();return}
    if(ios){how.innerHTML="In Safari, tap <b>Share</b> <span aria-hidden='true'>⬆︎</span> then <b>Add to Home Screen</b>.";btn.hidden=true;show();return}
    if(/Android/i.test(ua)){how.innerHTML="In Chrome, tap <b>⋮</b> then <b>Add to Home screen</b> or <b>Install app</b>.";btn.hidden=true;show()}
  },4000);
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
