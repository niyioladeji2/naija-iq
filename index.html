<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-column "danfo ride" — checker-striped bus band on top; home = daily ticket + free ride; play = bus-stop route */
/* Palette: soft warm paper + muted Nigerian green + gentle danfo mustard; dark mode is a calm charcoal with the same hues dimmed */
:root{
  --bg:#F6F2E9; --surface:#FFFDF8; --sunk:#EFE9DC; --ink:#2C2B27; --muted:#6F6A5D;
  --line:#E2DACA; --edge:#CFC6B2;
  --accent:#2F7A5B; --accent-ink:#FFFFFF; --accent-deep:#24614A; --accent-soft:#DCEBE2;
  --danfo:#E9C46A; --danfo-soft:#F5E7BF; --band:#EDD08A; --band-ink:#2C2B27; --title:#24614A; --checker:#2C2B27;
  --wrong:#B5573F; --wrong-ink:#FFFFFF; --wrong-soft:#F4DDD5;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191A17; --surface:#22241F; --sunk:#1D1F1B; --ink:#E8E4D8; --muted:#A39E8E;
  --line:#33362F; --edge:#45493F;
  --accent:#6DBE96; --accent-ink:#10231A; --accent-deep:#4C9874; --accent-soft:#24362C;
  --danfo:#D2AE55; --danfo-soft:#3A3323; --band:#23251F; --band-ink:#E8E4D8; --title:#D9B75E; --checker:#D2AE55;
  --wrong:#E08B74; --wrong-ink:#2A120C; --wrong-soft:#3D2721; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191A17; --surface:#22241F; --sunk:#1D1F1B; --ink:#E8E4D8; --muted:#A39E8E;
  --line:#33362F; --edge:#45493F;
  --accent:#6DBE96; --accent-ink:#10231A; --accent-deep:#4C9874; --accent-soft:#24362C;
  --danfo:#D2AE55; --danfo-soft:#3A3323; --band:#23251F; --band-ink:#E8E4D8; --title:#D9B75E; --checker:#D2AE55;
  --wrong:#E08B74; --wrong-ink:#2A120C; --wrong-soft:#3D2721; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.band{background:var(--band);color:var(--band-ink)}
.band .checker{opacity:.9}
.band-inner{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.checker{height:14px;background:
  repeating-linear-gradient(90deg,var(--checker) 0 14px,transparent 14px 28px) 0 0/28px 7px repeat-x,
  repeating-linear-gradient(90deg,transparent 0 14px,var(--checker) 14px 28px) 0 7px/28px 7px repeat-x;background-color:var(--band);opacity:.85}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.75rem,7vw,2.7rem);line-height:.95;margin:6px 0 0;text-wrap:balance}
h1 span{color:var(--title)}
.band.compact h1{font-size:clamp(1.2rem,5vw,1.5rem)}
.band.compact h1 span{display:inline}
.band.compact .eyebrow{display:none}
.bandctl{display:flex;gap:8px;align-self:flex-start;margin-top:2px}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;padding:0;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1.5px solid color-mix(in srgb,var(--band-ink) 30%,transparent);color:var(--band-ink);border-radius:50%;cursor:pointer}
.iconbtn:hover{background:var(--surface)}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.1}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;gap:18px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{font:inherit;font-family:var(--display);font-size:19px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:13px 24px;cursor:pointer;box-shadow:0 3px 0 var(--accent-deep);transition:filter .15s;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--edge);box-shadow:none;font-size:16px;padding:10px 18px}
.btn.small{font-size:16px;padding:9px 16px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}

/* daily ticket */
.ticket{background:var(--surface);border:1.5px solid var(--edge);border-radius:16px;box-shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px -12px rgb(0 0 0 / .18);padding:18px;display:grid;gap:12px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--edge);transform:translateY(-50%)}
.ticket::before{left:-11px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-11px;clip-path:inset(0 50% 0 0)}
.ticket h2{font-size:26px}
.grid{font-size:22px;letter-spacing:2px;line-height:1.2;word-break:break-all}
.flame{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:var(--danfo-soft);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.countdown{font-variant-numeric:tabular-nums}

/* level */
.level{display:grid;gap:6px}
.lvbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cat{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:0}
.cat b{font-weight:800;font-size:16px}
.cat small{color:var(--muted);font-size:12.5px;line-height:1.3}
.cat:hover{border-color:var(--accent);background:var(--sunk)}
.cat,.opt,.chip{transition:border-color .15s,background-color .15s}
.cat.mix{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.cat.mix small{color:var(--muted)}

/* play */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.topbar .score{font-family:var(--display);font-size:20px}
.route{display:flex;align-items:center;margin:2px 6px 0 0}
.stop{flex:1;height:4px;background:var(--line);position:relative}
.stop::after{content:"";position:absolute;right:-6px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line);box-sizing:border-box}
.stop.ok{background:var(--accent)}.stop.ok::after{border-color:var(--accent);background:var(--accent)}
.stop.bad{background:var(--wrong)}.stop.bad::after{border-color:var(--wrong);background:var(--wrong)}
.stop.now::after{border-color:var(--accent);background:var(--danfo)}
.timer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.timer .bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--danfo);border-radius:999px;transform-origin:left;transition:transform 1s linear}
.timer.low .fill{background:var(--wrong)}
.timer .secs{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.q{font-size:clamp(1.25rem,5vw,1.65rem);font-weight:800;line-height:1.25;margin:8px 0 0;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:17px;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px}
.opt .k{font-family:var(--display);font-size:14px;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--danfo-soft);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--sunk)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt.correct{border-color:var(--accent);background:var(--accent-soft);opacity:1;text-decoration:none}
.opt.correct .k{background:var(--accent);color:var(--accent-ink)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.wrong .k{background:var(--wrong);color:var(--wrong-ink)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:800;background:var(--surface);color:var(--ink);border:1.5px solid var(--edge);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.streak{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.streak.hot{color:var(--wrong)}
.fact{background:var(--surface);border:1.5px dashed var(--edge);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.fact .verdict{font-family:var(--display);font-size:20px;margin:0}
.fact p{margin:0}
.fact .verdict.ok{color:var(--accent)}.fact .verdict.bad{color:var(--wrong)}
.after{display:grid;gap:12px}
.after .btn{justify-self:stretch}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.leave{background:var(--surface);border:1.5px solid var(--edge);border-radius:12px;padding:14px;display:grid;gap:10px}

/* results */
.result{background:var(--surface);border:1.5px solid var(--edge);border-radius:16px;padding:20px;display:grid;gap:6px;box-shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px -12px rgb(0 0 0 / .18)}
.big{font-family:var(--display);font-size:clamp(3rem,16vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;color:var(--muted)}
.rank{font-size:22px;font-weight:800;margin:0}
.share{display:grid;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.share pre{margin:0;font-family:var(--body);font-size:15px;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:12px;user-select:all}
.field{display:grid;gap:6px}
.field input{font:inherit;font-size:17px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;flex:1 1 180px}
.review{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.review li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.review .dot{width:14px;height:14px;border-radius:50%;margin-top:5px}
.review small{display:block;color:var(--muted)}
details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:800}

/* leaderboard */
.board{display:grid;gap:10px}
.tabs{display:inline-flex;border:1.5px solid var(--edge);background:var(--surface);border-radius:999px;overflow:hidden}
.tabs button{font:inherit;font-weight:800;font-size:14px;background:transparent;color:var(--ink);border:none;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.lb{margin:0;padding:0;list-style:none;border:1.5px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--surface)}
.lb li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb li:first-child{border-top:none}
.lb .pos{font-family:var(--display);font-size:16px;color:var(--muted)}
.lb li.top .pos{color:var(--ink)}
.lb li.top{background:var(--danfo-soft)}
.lb .who{min-width:0;overflow-wrap:anywhere}
.lb .who b{font-weight:800}
.lb .who small{display:block;color:var(--muted);font-size:13px}
.lb .p{font-family:var(--display);font-size:17px}
.lb li.me{outline:2px solid var(--accent);outline-offset:-2px}
.lb .empty{display:block;padding:14px;color:var(--muted);grid-column:1/-1}


/* home: stats strip, mix button, category pills, how-to */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.stat b{font-size:17px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:12.5px}
.stat .label{font-size:11px}
.stat .lvbar{display:block;height:6px;margin:5px 0 2px}
.free{display:grid;gap:12px}
.mixbtn{font:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--accent-soft);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,filter .15s}
.mixbtn b{display:block;font-size:18px;font-weight:800}
.mixbtn small{color:var(--muted);font-size:13.5px}
.mixbtn .arrow{font-size:22px;color:var(--accent);flex:none}
.mixbtn:hover{border-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:15px;font-weight:600;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background-color .15s}
.pill:hover{border-color:var(--accent);background:var(--sunk)}
.howto ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.linkbtn{font:inherit;font-weight:800;background:none;border:none;color:var(--accent);cursor:pointer;justify-self:start;padding:4px 0}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.ownerbox{display:grid;gap:10px;border-top:1.5px dashed var(--edge);padding-top:18px}
.stats.owner .stat b{font-size:22px}
.hintrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hintrow .hint{text-align:left}
.linkbtn.small{font-size:13px;color:var(--muted);text-decoration:underline}
#reportNote{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;resize:vertical}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:no-preference){
 .pop{animation:pop .3s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
 .shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
}
@media (prefers-reduced-motion:reduce){.timer .fill{transition:none}}
</style>

<div class="band" id="band">
  <div class="band-inner">
    <div>
      <div class="eyebrow">You think you know Naija?</div>
      <h1>Naija <span>IQ</span></h1>
    </div>
    <div class="bandctl"><button class="iconbtn" id="theme" aria-label="Colour theme"></button><button class="iconbtn" id="sound" aria-pressed="true" aria-label="Sound"></button></div>
  </div>
  <div class="checker" aria-hidden="true"></div>
</div>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const Q = [
 // PLACES
 {c:"Places",q:"Which city replaced Lagos as Nigeria's capital in 1991?",a:"Abuja",o:["Ibadan","Kaduna","Lokoja"],f:"Abuja was planned from scratch, partly because it sits close to the centre of the country."},
 {c:"Places",q:"Which state proudly calls itself the \"Centre of Excellence\"?",a:"Lagos",o:["Ogun","Rivers","Oyo"],f:"You'll see \"Centre of Excellence\" on Lagos plate numbers."},
 {c:"Places",q:"Which state is nicknamed the \"Coal City State\"?",a:"Enugu",o:["Kogi","Anambra","Benue"],f:"Coal was mined around Enugu from the early 1900s, and the city grew around it."},
 {c:"Places",q:"Port Harcourt's popular nickname is…",a:"The Garden City",o:["The Oil City","The River City","The Palm City"],f:"PH earned \"Garden City\" for its parks and greenery in colonial times."},
 {c:"Places",q:"At Lokoja, the River Niger meets which river?",a:"Benue",o:["Kaduna","Sokoto","Cross River"],f:"The confluence forms a Y shape, and Lokoja was once the colonial capital."},
 {c:"Places",q:"Calabar is the capital of which state?",a:"Cross River",o:["Akwa Ibom","Rivers","Bayelsa"],f:"Calabar is also famous for edikang ikong and afang soup."},
 {c:"Places",q:"Cocoa House, once the tallest building in tropical Africa, is in which city?",a:"Ibadan",o:["Lagos","Akure","Abeokuta"],f:"It was funded by cocoa farming revenue and completed in 1965."},
 {c:"Places",q:"Plateau State's slogan is…",a:"Home of Peace and Tourism",o:["Food Basket of the Nation","Land of Promise","Gateway State"],f:"Jos sits around 1,200 m up, which is why the weather is cooler there."},
 {c:"Places",q:"\"Made in Aba\" is famous for what?",a:"Shoes, bags and clothing",o:["Palm wine","Cars","Pottery"],f:"Aba's Ariaria market is one of West Africa's biggest trading hubs."},
 {c:"Places",q:"Which ancient city is known for its old walls and the Kofar Mata dye pits?",a:"Kano",o:["Zaria","Bauchi","Maiduguri"],f:"The Kofar Mata dye pits have been used for indigo dyeing for centuries."},

 // SLANG
 {c:"Slang",q:"Your guy says he wants to \"japa\". What's his plan?",a:"Relocate abroad",o:["Run from a fight","Start a business","Get married"],f:"Japa comes from Yoruba for \"run, flee\", and became the word for emigrating."},
 {c:"Slang",q:"\"Sapa don hold me\" means…",a:"I'm broke",o:["I'm hungry","I'm sick","I'm in love"],f:"Sapa is the end-of-month dryness of the pocket."},
 {c:"Slang",q:"\"Wahala\" means…",a:"Trouble",o:["Party","Money","Sleep"],f:"\"No wahala\" means no problem."},
 {c:"Slang",q:"An \"owambe\" is…",a:"A big, lavish party",o:["A night bus","A market stall","A church service"],f:"Think aso-ebi, jollof, live band and plenty spraying of money."},
 {c:"Slang",q:"If something \"get K-leg\", it is…",a:"Suspicious or not quite right",o:["Very fast","Very expensive","Newly bought"],f:"Like a leg that's bent: something isn't straight about the matter."},
 {c:"Slang",q:"\"Gbas gbos\" describes…",a:"A fight or exchange of blows",o:["Loud music","Heavy rain","Fast driving"],f:"The sound effect of trading punches, in two syllables."},
 {c:"Slang",q:"\"Abeg\" means…",a:"Please",o:["Thank you","Come here","Hurry up"],f:"Used for begging, and also for \"abeg, leave me\"."},
 {c:"Slang",q:"Someone \"dey form shakara\". They are…",a:"Showing off or playing hard to get",o:["Very tired","Telling lies","Cooking"],f:"Fela even has a song titled Shakara."},
 {c:"Slang",q:"\"Wetin dey happen?\" means…",a:"What's going on?",o:["Where are you going?","How much is it?","Who sent you?"],f:"Pidgin English unites Nigerians across more than 500 languages."},

 {c:"Customs",q:"At a Yoruba traditional wedding, the groom and his friends often do what to greet the bride's family?",a:"Prostrate on the floor",o:["Kneel on one knee","Bow from the waist","Shake hands with everyone"],f:"\"Dobale\" is the male prostration, a sign of respect."},

 {c:"Customs",q:"In many Nigerian homes, a visitor is first offered…",a:"Water or something to drink",o:["A bill","A chair outside","A newspaper"],f:"Refusing everything can be seen as impolite."},
 {c:"Customs",q:"\"House warming\" in Nigeria usually involves…",a:"Prayers and a party for a new home",o:["Turning on the heater","Painting the walls","Moving out"],f:"Friends and family bless the new home."},
 {c:"Customs",q:"In many Nigerian cultures, a widow traditionally mourns for…",a:"A set period, sometimes months",o:["One hour","Exactly one day","Ten years"],f:"Mourning customs vary widely and some harmful ones are now discouraged."},
  {c:"Customs",q:"In Igbo culture, the ceremony where a man's family first knocks on the bride's family door is called…",a:"Iku aka",o:["Igba nkwu","Ime ego","Ikwa ozu"],f:"\"Iku aka\" literally means \"knocking on the door\"."},
  {c:"Customs",q:"In Benin (Edo) weddings, the bride often wears beads made of…",a:"Coral",o:["Glass","Gold","Wood"],f:"Coral beads are a symbol of royalty and wealth in Benin."},
  {c:"Customs",q:"Circumcision of baby boys in Nigeria is…",a:"Very common",o:["Banned","Very rare","Only for kings"],f:"It is widely practised across Christian and Muslim families."},
 {c:"Customs",q:"\"Ewe\" in a Yoruba compound often refers to…",a:"Leaves, including medicinal herbs",o:["Wine","Shoes","Money"],f:"\"Agbo\" is a herbal drink made by boiling leaves and roots."},
 {c:"Customs",q:"\"Agbo\" is…",a:"A traditional herbal remedy",o:["A dance","A hat","A wedding gift"],f:"It's made from leaves, roots and bark, often sold in markets."},
 {c:"Customs",q:"\"Ojukokoro\" in Yoruba means…",a:"Greed",o:["Generosity","Bravery","Patience"],f:"Literally \"eyes of desire\"."},
 {c:"Customs",q:"\"Omoluabi\" in Yoruba culture describes a person of…",a:"Good character",o:["Great wealth","Royal blood","Strong body"],f:"Being an omoluabi is one of the highest Yoruba ideals."},
 {c:"Customs",q:"In Igbo culture, \"Ichi\" refers to…",a:"Traditional facial scarification for titled men",o:["A wedding dance","A type of yam","A song"],f:"Ichi marks were a sign of high status among some Igbo groups."},
 {c:"Customs",q:"Yoruba facial marks are called…",a:"Ila",o:["Ichi","Lalle","Tiro"],f:"Different patterns once showed a person's town or lineage."},
 {c:"Customs",q:"The \"Ozo\" title is one of the highest titles in…",a:"Igbo society",o:["Hausa emirates","Yoruba kingdoms","Tiv villages"],f:"Ozo titleholders are respected elders in many Igbo communities."},
 {c:"Customs",q:"At Nigerian weddings, the couple's first dance is often followed by guests…",a:"Spraying money on them",o:["Leaving the hall","Throwing rice only","Singing the anthem"],f:"Money sprayed on the couple is collected by helpers."},
 {c:"Customs",q:"A \"white wedding\" in Nigeria usually means…",a:"A church wedding",o:["A wedding in harmattan","A traditional wedding","A court wedding only"],f:"Many couples do both a traditional and a white wedding."},
 {c:"Customs",q:"A \"registry\" wedding in Nigeria is…",a:"A civil marriage at a government registry",o:["A traditional wedding","A church blessing","An engagement party"],f:"It's the legal marriage under the Marriage Act."},
 {c:"Customs",q:"At a Nigerian wedding reception, the \"cake cutting\" is often led by…",a:"The couple, with the MC",o:["The caterer alone","The DJ","The bride's driver"],f:"Pieces may be shared with special guests."},
 {c:"Customs",q:"\"Small chops\" at Nigerian parties are…",a:"Finger foods like puff-puff, samosa and spring rolls",o:["Tiny portions of jollof","Cut-up fruit only","Raw vegetables"],f:"No party is complete without a tray of small chops."},
 {c:"Customs",q:"\"Puff-puff\" is…",a:"A sweet fried dough ball",o:["A type of smoke","A dance","A hair style"],f:"It's a favourite snack at parties and on the street."},
 {c:"Customs",q:"\"Takeaway\" at Nigerian parties usually means…",a:"Food packed for guests to take home",o:["A dance at the end","A fight","The gift list"],f:"Some guests come with their own containers."},
 {c:"Customs",q:"\"Aso ebi\" fabrics are often bought…",a:"From the celebrant's family",o:["Only at the party","For free","From the government"],f:"Buying the aso ebi shows support for the celebrant."},
 {c:"Customs",q:"\"Ankara\" aso ebi is usually cheaper than…",a:"Lace or aso-oke",o:["Cotton T-shirts","Plastic bags","School uniforms"],f:"Families may pick fabrics at different prices for different guests."},
 {c:"Customs",q:"In Yoruba culture, \"Ikomojade\" is another name for…",a:"The naming ceremony",o:["The funeral","The wedding","A title ceremony"],f:"It means bringing the child out to meet the world."},
 {c:"Customs",q:"In many Nigerian cultures, new mothers are cared for by…",a:"Their own mother or mother-in-law",o:["Only a nurse","No one","The village chief"],f:"This is called \"omugwo\" among the Igbo."},
 {c:"Customs",q:"\"Omugwo\" is…",a:"The postpartum care a grandmother gives a new mother",o:["A wedding dance","A burial song","A harvest festival"],f:"Grandmothers cook, bathe the baby and help the new mother rest."},
 {c:"Customs",q:"During omugwo, new mothers are often given hot…",a:"Pepper soup",o:["Ice cream","Garri soakings","Zobo only"],f:"Hot pepper soup is believed to help recovery."},
 {c:"Customs",q:"\"Ugwu\" in Igbo can mean…",a:"Respect or honour",o:["Pepper","Moon","River"],f:"Ugu (fluted pumpkin) is a different word."},
 {c:"Customs",q:"In Igbo culture, \"Iwa akwa\" is a ceremony marking a young man's…",a:"Coming of age",o:["Wedding","First harvest","Retirement"],f:"It means \"tying the cloth\", a sign he is now a man."},
 {c:"Customs",q:"\"Ofala\" festivals celebrate…",a:"A king's anniversary and his people",o:["The first rain","The end of school","A new bridge"],f:"The king comes out in full regalia to greet his subjects."},
 {c:"Customs",q:"\"Iri ji\" means…",a:"Eating new yam",o:["Planting yam","Selling yam","Burying yam"],f:"It marks the start of the new yam harvest."},
 {c:"Customs",q:"At the Igbo New Yam Festival, who usually eats the first yam?",a:"The king or eldest man",o:["The youngest child","Any visitor","The best farmer's wife"],f:"He thanks the gods and ancestors for the harvest."},
 {c:"Customs",q:"Many Igbo communities traditionally don't eat new yam until…",a:"The New Yam Festival",o:["Christmas","The first rain","Easter"],f:"Eating it earlier was seen as disrespectful to the land."},
 {c:"Customs",q:"In Yoruba homes, it is polite to greet elders as soon as you…",a:"Wake up or see them",o:["Finish eating","Leave the house","Go to bed"],f:"Not greeting can be taken as rude."},
 {c:"Customs",q:"\"E kaale\" in Yoruba is a greeting for…",a:"The evening",o:["The morning","Noon","Midnight"],f:"\"E kaasan\" is for the afternoon."},
 {c:"Customs",q:"\"Ka chi fo\" in Igbo means…",a:"Good night",o:["Good morning","Welcome","Thank you"],f:"It literally means \"until the day breaks\"."},
 {c:"Customs",q:"\"Sai da safe\" in Hausa means…",a:"Good night (until morning)",o:["Good morning","Sorry","Welcome"],f:"Safe means morning."},
 {c:"Customs",q:"In Hausa culture, younger people often greet elders by…",a:"Crouching or squatting slightly",o:["Hugging them","Standing tall","Clapping"],f:"Lowering yourself shows respect."},
 {c:"Customs",q:"In Igbo culture, a younger person greeting a titled chief may use…",a:"The chief's title name",o:["The chief's first name","\"Hey you\"","A whistle"],f:"Titled men are addressed by their title names."},
 {c:"Customs",q:"\"Igwe\" is a title for…",a:"An Igbo traditional ruler",o:["A Yoruba chief priest","A Hausa trader","An Ijaw fisherman"],f:"Igwe means \"sky\" or \"heaven\"."},
 {c:"Customs",q:"In many Nigerian homes, children are expected to serve visitors…",a:"Drinks and food",o:["Bills","Homework","Newspapers"],f:"Children often bring water or a drink as soon as a guest sits down."},
 {c:"Customs",q:"\"Sorry\" in Nigerian English is often said when…",a:"Someone gets hurt, even if you didn't cause it",o:["You want to leave","You are angry","You win a game"],f:"It's an expression of sympathy, not just an apology."},
 {c:"Customs",q:"\"Well done\" in Nigeria is often said to…",a:"Someone working",o:["Someone sleeping","Someone eating","Someone leaving"],f:"It's a greeting as much as praise."},
 {c:"Customs",q:"\"Have you eaten?\" from a Nigerian host is…",a:"A sign of hospitality",o:["A rude question","A medical check","A test"],f:"Many hosts will insist you eat something."},
 {c:"Customs",q:"\"I'm coming\" in Nigerian English often means…",a:"I'll be back soon",o:["I'm walking towards you","I'm leaving forever","I'm arriving now"],f:"Someone may say \"I'm coming\" as they walk out the door."},
 {c:"Customs",q:"\"African time\" jokingly refers to…",a:"Starting events late",o:["Waking up early","A time zone","Timekeeping by the sun"],f:"An event fixed for 10am may start at noon."},
 {c:"Customs",q:"\"Bride price\" in many Nigerian cultures is paid by…",a:"The groom's family",o:["The bride's family","The church","The government"],f:"In many families it's small and symbolic."},
 {c:"Customs",q:"In some Igbo families, the bride's father may return part of the bride price to show…",a:"His daughter is not for sale",o:["He is angry","He wants more","The wedding is cancelled"],f:"It's a symbolic gesture of goodwill."},
 {c:"Customs",q:"At Yoruba weddings, the groom's family brings a big basket of…",a:"Yams, fruits and gifts",o:["Live goats only","Books","Furniture"],f:"The items are listed in the engagement list."},
 {c:"Customs",q:"\"Yoruba demons\" is a playful nickname for…",a:"Yoruba men, as heartbreakers",o:["Masquerades","Football fans","Market women"],f:"It's a running joke, made famous by films like Merry Men."},
 {c:"Customs",q:"In Yoruba weddings, the bride's veil is lifted by…",a:"The groom",o:["The priest","Her father","Her mother"],f:"Then the groom is often asked to pay before he sees her face."},
 {c:"Customs",q:"At many Yoruba engagements, a \"fake bride\" is presented first to…",a:"Tease the groom's family",o:["Confuse the photographer","Test the food","Collect money"],f:"Several veiled women may come out before the real bride."},
 {c:"Customs",q:"In Calabar, a traditional Efik bride may wear…",a:"Coral beads and a big wrapper with a fan",o:["Jeans and a T-shirt","Only white","A crown of leaves"],f:"Efik brides are known for their elegant, colourful outfits."},
 {c:"Customs",q:"In Tiv culture, a man's \"kwagh-hir\" is…",a:"A puppet and storytelling performance",o:["His farm","His wife","His title"],f:"Kwagh-hir means \"something magical\"."},
 {c:"Customs",q:"In Tiv tradition, \"Anger\" is a popular…",a:"Striped cloth",o:["Drum","Mask","Hat"],f:"The black-and-white striped anger cloth is a symbol of Tiv identity."},
 {c:"Customs",q:"\"Kwaghir\" and \"swange\" are both linked to the…",a:"Tiv",o:["Hausa","Igbo","Edo"],f:"Swange is a popular Tiv dance."},
 {c:"Customs",q:"\"Atilogwu\" is…",a:"An acrobatic Igbo dance",o:["A Hausa food","A Yoruba cap","An Ijaw canoe"],f:"Dancers perform flips and fast footwork to drums."},
 {c:"Customs",q:"\"Bata\" in Yoruba culture is a…",a:"Drum and dance linked to Sango",o:["Type of shoe only","Wedding gift","Wrapper"],f:"Bata drumming is fast and powerful."},
 {c:"Customs",q:"The Yoruba \"dundun\" is better known as the…",a:"Talking drum",o:["Flute","Gong","Rattle"],f:"Players squeeze the strings to change its pitch and \"talk\"."},
 {c:"Customs",q:"The \"udu\" is an Igbo instrument made from…",a:"Clay",o:["Wood","Metal","Leather"],f:"It's a pot drum with a hole in its side."},
 {c:"Customs",q:"The \"ogene\" is…",a:"An Igbo metal gong",o:["A Yoruba hat","A Hausa sword","An Ijaw boat"],f:"Its sharp sound leads many Igbo songs."},
 {c:"Customs",q:"\"Shekere\" is…",a:"A gourd rattle covered with beads",o:["A drum","A flute","A horn"],f:"It's shaken or struck to keep rhythm."},
 {c:"Customs",q:"The \"kakaki\" is a long trumpet played for…",a:"Northern emirs",o:["Igbo weddings","Yoruba funerals","Ijaw fishermen"],f:"It can be over three metres long."},
 {c:"Customs",q:"\"Goge\" is a Hausa…",a:"One-string fiddle",o:["Drum","Cap","Shoe"],f:"It's played with a bow."},
 {c:"Customs",q:"In many Nigerian homes, a pot of soup is cooked to last…",a:"Several days",o:["One meal only","A year","An hour"],f:"Big pots of soup or stew are kept and warmed daily."},
 {c:"Customs",q:"\"Mama\" or \"Iya\" before a food seller's name, like \"Iya Basira\", shows…",a:"Respect for an older woman",o:["She is your mother","She is a queen","She is a teacher"],f:"Iya means mother in Yoruba."},
 {c:"Customs",q:"\"Mallam\" in Nigerian usage often refers to…",a:"A Hausa man or Islamic teacher",o:["A Yoruba chief","An Igbo trader","An Ijaw fisherman"],f:"It comes from an Arabic word for teacher."},
 {c:"Customs",q:"\"Alhaji\" is a title for a man who has…",a:"Completed the Hajj to Mecca",o:["Many wives","A university degree","Won an election"],f:"A woman who has done the Hajj is called Alhaja (Hajiya in Hausa)."},
 {c:"Customs",q:"\"Hajiya\" is the Hausa title for…",a:"A woman who has done the Hajj",o:["A queen","A young girl","A teacher"],f:"It's also used as a respectful title for older women."},
 {c:"Customs",q:"\"Ma\" or \"Sir\" at the end of a sentence in Nigeria shows…",a:"Respect",o:["Anger","A question","Surprise"],f:"\"Good morning ma\" is everyday Nigerian politeness."},
 {c:"Customs",q:"\"Oga\" means…",a:"Boss or master",o:["Friend","Brother","Driver"],f:"\"Oga at the top\" became a famous phrase in 2013."},
 {c:"Customs",q:"\"Madam\" in Nigerian usage often refers to…",a:"A female boss or the woman of the house",o:["Any young girl","A nurse only","A queen"],f:"Drivers and staff often call their female employer Madam."},
 {c:"Customs",q:"In Nigeria, \"Chief\" before a name usually means…",a:"The person holds a traditional title",o:["They are a cook","They are a police chief","They are a pilot"],f:"Titles are often given to people for their contributions."},
 {c:"Customs",q:"A chieftaincy title in Yoruba land is often conferred by…",a:"A king (Oba)",o:["The President","A football club","A university"],f:"Titles like \"Otunba\" and \"Asiwaju\" are popular."},
 {c:"Customs",q:"\"Asiwaju\" is a Yoruba title meaning…",a:"Leader or pathfinder",o:["Cook","Hunter","Singer"],f:"It means one who goes in front."},
 {c:"Customs",q:"\"Otunba\" is a Yoruba title often given to…",a:"Distinguished men, sometimes princes",o:["Children","Market women only","Fishermen only"],f:"\"Yeye\" is a common title for distinguished women."},
 {c:"Customs",q:"In Igbo land, a man who takes the Ozo title may be called…",a:"Nze",o:["Oba","Emir","Obong"],f:"\"Nze na Ozo\" is the respected society of titled men."},
 {c:"Customs",q:"\"Akwa ocha\" in Delta is often worn at…",a:"Weddings and important ceremonies",o:["Football matches only","Funerals only","The beach"],f:"The white woven cloth is a symbol of Anioma heritage."},
 {c:"Customs",q:"\"Ijo\" is the Yoruba word for…",a:"Dance",o:["Church","Market","Song"],f:"\"Ijo\" can also mean a gathering or church, depending on tone."},
 {c:"Customs",q:"\"Orin\" in Yoruba means…",a:"Song",o:["Dance","Food","Drum"],f:"\"Ko orin\" means sing a song."},
 {c:"Customs",q:"\"Egwu\" in Igbo can mean…",a:"Dance or play",o:["Rain","Mother","Yam"],f:"With a different tone it can also mean fear."},
 {c:"Customs",q:"\"Rawa\" in Hausa means…",a:"Dance",o:["Song","Market","Sleep"],f:"\"Waka\" means song in Hausa."},
 {c:"Customs",q:"A Nigerian \"thanksgiving\" service is held after…",a:"A happy event like a birthday, new job or recovery",o:["A football loss","An exam failure","A funeral only"],f:"Families dance to the altar with gifts and offerings."},
 {c:"Customs",q:"\"Dedication\" in many Nigerian churches is…",a:"A service presenting a baby to God",o:["Opening a new road","A wedding","A graduation"],f:"It often happens a few weeks after the naming ceremony."},
 {c:"Customs",q:"In many Nigerian cultures, twins were once seen as a bad omen, but the Yoruba…",a:"Celebrate them",o:["Never mention them","Rename them at age ten","Send them away"],f:"Yoruba people have one of the world's highest twin birth rates."},
 {c:"Customs",q:"\"Igbo-Ora\" in Oyo State is nicknamed the…",a:"Twin capital of the world",o:["City of kings","Home of yams","Town of drums"],f:"It hosts a yearly twins festival."},
 {c:"Customs",q:"In Yoruba tradition, ibeji carvings were made when…",a:"A twin died",o:["Twins married","Twins graduated","Twins were born"],f:"The carving was cared for as if it were the living twin."},
 {c:"Customs",q:"\"Ewa\" in Yoruba means both beans and…",a:"Beauty (with a different tone)",o:["Bread","Water","Wine"],f:"Tone changes meaning in Yoruba."},
 {c:"Customs",q:"In many Nigerian homes, shoes are often removed before entering…",a:"A mosque or some homes",o:["A bank","A bus","A supermarket"],f:"Shoes are always removed before entering a mosque."},
 {c:"Customs",q:"At a Nigerian Muslim wedding (Nikkah), a key requirement is the…",a:"Mahr (dowry paid to the bride)",o:["Wedding cake","Aso ebi","Church choir"],f:"The mahr is given to the bride herself."},
 {c:"Customs",q:"The traditional Edo wedding is completed when the bride is formally…",a:"Handed over by her family to the groom's family",o:["Crowned queen","Given a car","Sent to school"],f:"Elders pray over the couple as she joins her husband's family."},
 {c:"Customs",q:"\"Ijo Iyawo\" in Yoruba refers to…",a:"The bride's dance",o:["The bride's mother","The bride's hair","The bride's shoes"],f:"Guests spray money as the bride dances in."},
 {c:"Customs",q:"\"Isi ewu\" and \"nkwobi\" are popular at…",a:"Igbo gatherings and joints",o:["Hausa weddings only","Yoruba naming ceremonies only","Breakfast"],f:"They're often enjoyed with cold drinks."},
 {c:"Customs",q:"In Igbo custom, a guest who brings kola is said to bring…",a:"Life",o:["Trouble","Rain","Debt"],f:"\"Onye wetara oji wetara ndu\": whoever brings kola brings life."},
 {c:"Customs",q:"In Yoruba homes, the first thing often offered to a respected guest with kola is…",a:"Bitter kola or kola nut",o:["Fried rice","Chocolate","Coffee"],f:"Kola is a sign of welcome across many Nigerian cultures."},
 // ===== NEW: PROVERBS =====
 {c:"Proverbs",q:"Achebe wrote that among the Igbo, proverbs are the palm oil with which…",a:"Words are eaten",o:["Soup is cooked","Elders are fed","Yams are fried"],f:"It's from Things Fall Apart and shows how much proverbs matter in conversation."},
 {c:"Proverbs",q:"Finish the Igbo-inspired proverb: \"When the moon is shining, the cripple becomes…\"",a:"Hungry for a walk",o:["Angry","Sleepy","A king"],f:"It's from Things Fall Apart: good conditions make everyone want to join in."},
 {c:"Proverbs",q:"\"A child who washes his hands can eat with kings\" means…",a:"Good conduct earns you respect",o:["Wash before eating","Kings are clean","Children should cook"],f:"It's another proverb Achebe used in Things Fall Apart."},
 {c:"Proverbs",q:"\"The lizard that jumped from the high iroko tree said it would praise itself if no one else did\" means…",a:"Celebrate your own achievements",o:["Never climb trees","Lizards are proud","Avoid danger"],f:"Okonkwo's story in Things Fall Apart uses this proverb."},
 {c:"Proverbs",q:"\"When a man says yes, his chi says yes also\" is about…",a:"Determination shaping your destiny",o:["Agreeing with elders","Saying yes to marriage","Obeying the king"],f:"\"Chi\" is a person's personal god or guiding spirit in Igbo belief."},
 {c:"Proverbs",q:"\"The fly that has no one to advise it follows the corpse into the grave\" warns against…",a:"Ignoring good advice",o:["Going to funerals","Killing flies","Eating late"],f:"It's a popular Igbo proverb."},
 {c:"Proverbs",q:"\"A man who brings home ant-infested firewood should not complain when lizards pay him a visit\" means…",a:"Accept the results of your own choices",o:["Kill all ants","Buy new firewood","Lizards are dangerous"],f:"You invited the trouble, so you can't complain about it."},
 {c:"Proverbs",q:"\"The chicken that will grow into a cock can be spotted the day it hatches\" means…",a:"Greatness shows early",o:["All chickens are the same","Cocks are lazy","Eggs are precious"],f:"Similar proverbs exist across many Nigerian languages."},
 {c:"Proverbs",q:"\"No matter how long the night, the day will surely break\" teaches…",a:"Hope: hard times end",o:["Sleep early","Nights are dangerous","Work at night"],f:"It's a favourite proverb in tough times."},
 {c:"Proverbs",q:"\"Ọ̀rọ̀ púpọ̀ kì í kún agbọ̀n\" (Yoruba) means talk alone doesn't…",a:"Fill a basket",o:["Win a war","Feed a king","Build a house"],f:"Many words don't fill a basket: action matters more than talk."},
 {c:"Proverbs",q:"\"Àgbà kì í wà lọ́jà kí orí ọmọ tuntun wọ́\" means an elder can't be in the market while…",a:"A baby's head is left lying crooked",o:["Prices go up","It rains","Thieves steal"],f:"Elders are expected to correct wrongs when they see them."},
 {c:"Proverbs",q:"\"Bí ọmọdé bá ṣubú, á wo iwájú; bí àgbà bá ṣubú, á wo ẹ̀yìn\" means…",a:"Elders look back to learn why they fell",o:["Children never fall","Elders fall more","Look where you walk"],f:"A child who falls looks forward; an elder looks back to see what caused it."},
 {c:"Proverbs",q:"The Yoruba proverb \"Ilé la ti ń kẹ́ṣọ̀ ròde\" means…",a:"Charity begins at home",o:["Stay indoors","Houses are expensive","Visitors bring gifts"],f:"Literally: it's from home that we dress up before going out."},
 {c:"Proverbs",q:"\"Ọmọ tí kò gbọ́ ti ìyá rẹ̀ á gbọ́ ti ayé\" means a child who won't listen to its mother…",a:"Will learn the hard way from the world",o:["Will become rich","Will go abroad","Will be a king"],f:"The world teaches harsher lessons than a parent."},
 {c:"Proverbs",q:"The Yoruba saying \"Ìwà lẹ̀sìn\" means…",a:"Character is religion",o:["Wealth is everything","Beauty fades","Patience is slow"],f:"Good conduct matters more than outward religious show."},
 {c:"Proverbs",q:"\"Sùúrù ni baba ìwà\" means…",a:"Patience is the father of good character",o:["Patience is for fools","Fathers are patient","Good things are fast"],f:"Patience is praised in many Yoruba proverbs."},
 {c:"Proverbs",q:"\"Àjèjé ọwọ́ kan kò gbẹ́rù dórí\" means…",a:"One hand can't lift a load onto the head",o:["Use your left hand","Loads are heavy","Carry less"],f:"It's about teamwork and cooperation."},
 {c:"Proverbs",q:"\"Igi kan kì í dá igbó ṣe\" means…",a:"One tree does not make a forest",o:["Plant more trees","Forests are dangerous","Cut trees carefully"],f:"Unity and cooperation are stronger than one person alone."},
 {c:"Proverbs",q:"\"Ìgbà ò lọ bí òréré, ayé ò lọ bí ọ̀pá ìbọn\" is about…",a:"Times and fortunes changing",o:["Guns being dangerous","Roads being long","Hunting at dawn"],f:"Time doesn't stretch on forever; the world doesn't run straight like a gun barrel."},
 {c:"Proverbs",q:"\"Ọwọ́ ọmọdé kò tó pẹpẹ, tàgbàlagbà kò wọ akèrègbè\" means…",a:"Young and old need each other",o:["Children are short","Elders are greedy","Shelves are high"],f:"The child's hand can't reach the shelf; the elder's hand won't fit in the gourd."},
 {c:"Proverbs",q:"\"Sannu sannu, bata hana zuwa\" (Hausa) means…",a:"Slowly but surely, you'll get there",o:["Hurry or you'll be late","Never travel slowly","Greet people slowly"],f:"Going slowly doesn't stop you from arriving."},
 {c:"Proverbs",q:"\"Kowa ya ci ladan kuturu, ya yi masa aski\" (Hausa) means…",a:"If you accept payment, do the job",o:["Avoid barbers","Help the sick","Never take money"],f:"Whoever takes the leper's fee must shave him."},
 {c:"Proverbs",q:"\"Ruwa baya tsami banza\" (Hausa) means…",a:"There's always a reason behind things",o:["Water is sour","Drink clean water","Rain is useless"],f:"Water doesn't go sour for nothing."},
 {c:"Proverbs",q:"\"Komai nisan jifa, ƙasa zai faɗo\" (Hausa) is about…",a:"Things eventually come back to earth",o:["Throwing stones","Farming","Long journeys"],f:"However far you throw, it comes back to the ground: everything ends."},
 {c:"Proverbs",q:"\"Abin da babba ya hango yana kwance, yaro ko ya hau rimi ba zai gani ba\" means…",a:"Elders see further than the young",o:["Climb trees to see","Children have sharp eyes","Elders sleep a lot"],f:"What an elder sees lying down, a child can't see even up a silk-cotton tree."},
 {c:"Proverbs",q:"\"Hakuri maganin duniya\" (Hausa) means…",a:"Patience is the cure for the world's troubles",o:["Medicine is expensive","The world is sick","Worry is useful"],f:"Hakuri (patience) is a key Hausa value."},
 {c:"Proverbs",q:"\"Da ruwan ciki ake jan na rijiya\" (Hausa) means…",a:"You need resources to get more resources",o:["Wells are deep","Drink water first","Rain fills wells"],f:"It's the water in your belly that gives you strength to draw from the well."},
 {c:"Proverbs",q:"\"Gani ya kori ji\" (Hausa) means…",a:"Seeing is better than hearing",o:["Listen carefully","Hearing is believing","Look away"],f:"Seeing for yourself beats hearsay."},
 {c:"Proverbs",q:"The Pidgin saying \"Monkey dey work, baboon dey chop\" means…",a:"One person works while another enjoys the profit",o:["Monkeys are lazy","Baboons are strong","Share your food"],f:"It's often used to complain about unfair systems."},
 {c:"Proverbs",q:"\"Who dey for inside, sabi wetin dey inside\" means…",a:"Only insiders know the real story",o:["Stay indoors","Inside is safe","Knock before entering"],f:"Outsiders shouldn't judge what they don't know."},
 {c:"Proverbs",q:"\"Na condition make crayfish bend\" means…",a:"Circumstances force people into situations",o:["Crayfish are naturally bent","Cooking changes food","Bending is good exercise"],f:"Don't judge someone without knowing their situation."},
 {c:"Proverbs",q:"\"Person wey get mouth no fit lose road\" means…",a:"If you ask, you won't get lost",o:["Talkative people are smart","Don't talk while walking","Mouths lead the way"],f:"Asking questions is wisdom."},
 {c:"Proverbs",q:"\"Dog wey go get lost no go hear the hunter's whistle\" means…",a:"Someone heading for ruin ignores warnings",o:["Dogs are deaf","Train your dog","Hunters whistle loudly"],f:"It echoes the proverb about the fly that follows the corpse."},
 {c:"Proverbs",q:"\"Who no know go know\" means…",a:"Those who doubt will soon find out",o:["Ignorance is bliss","Ask questions","Nobody knows everything"],f:"It's a confident warning that the truth will come out."},
 {c:"Proverbs",q:"\"Everything wey get beginning get end\" teaches…",a:"Nothing lasts forever",o:["Finish your food","Start early","Never begin anything"],f:"Good and bad times all pass."},
 {c:"Proverbs",q:"\"Na who wear shoe know where e dey pain am\" means…",a:"Only the sufferer knows their pain",o:["Buy bigger shoes","Shoes are expensive","Walk barefoot"],f:"Outsiders can't fully know your struggles."},
 {c:"Proverbs",q:"\"If you see old woman dey run, either she dey pursue something or something dey pursue am\" means…",a:"Unusual behaviour has a reason",o:["Old women love sports","Run every morning","Avoid running"],f:"Look for the cause when something unusual happens."},
 {c:"Proverbs",q:"\"Small pikin wey say im mama no go sleep, im too no go sleep\" means…",a:"Troublemakers suffer with those they trouble",o:["Children need sleep","Mothers are strong","Sleep early"],f:"Whoever stirs trouble shares in it."},
 {c:"Proverbs",q:"\"Slow and steady wins the race\" is closest to which Hausa proverb?",a:"Sannu sannu, bata hana zuwa",o:["Gani ya kori ji","Hakuri maganin duniya","Ruwa baya tsami banza"],f:"Both praise steady progress."},
 {c:"Proverbs",q:"\"Gbogbo alángbá ló dakùn délẹ̀, a ò mọ èyí tí inú ń run\" means…",a:"You can't tell who is suffering inside",o:["Lizards have bellyache","All lizards are equal","Watch the ground"],f:"All lizards lie flat on their bellies; we don't know which has a stomach ache."},
 {c:"Proverbs",q:"\"Adìẹ funfun kò mọ ara rẹ̀ lágbà\" warns against…",a:"Not acting your age or status",o:["Keeping white chickens","Washing clothes","Old age"],f:"The white hen doesn't know it's old: it still rolls in the dust."},
 {c:"Proverbs",q:"\"Ìyá ni wúrà, baba ni jígí\" means…",a:"Mother is gold, father is a mirror",o:["Gold is precious","Mirrors break","Parents are rich"],f:"It praises the value of both parents."},
 {c:"Proverbs",q:"\"Ọmọ ẹni kì í burú títí ká fi ọmọ ẹkùn fún ẹkùn pa jẹ\" means…",a:"Parents never give up on their children",o:["Leopards are dangerous","Children are bad","Hunt leopards"],f:"However bad your child, you won't hand them to a leopard."},
 {c:"Proverbs",q:"In Igbo, \"Egbe bere, ugo bere\" means…",a:"Let the kite perch and let the eagle perch",o:["Birds are free","The eagle is king","Fly high"],f:"Live and let live: whoever denies the other a place, may its wing break."},
 {c:"Proverbs",q:"\"Egbe bere, ugo bere\" teaches…",a:"Live and let live",o:["Fight for space","Birds should migrate","Hunt kites"],f:"It's one of the most famous Igbo proverbs, also quoted by Achebe."},
 {c:"Proverbs",q:"The Igbo saying \"Onye aghala nwanne ya\" means…",a:"Don't abandon your brother",o:["Everyone for themselves","Brothers fight","Leave home early"],f:"It's a call for unity and helping each other."},
 {c:"Proverbs",q:"\"Igwe bu ike\" means…",a:"Unity is strength",o:["The king is strong","The sky is high","Iron is hard"],f:"Igwe here means a multitude or crowd."},
 {c:"Proverbs",q:"\"Ebe onye dara ka chi ya kwaturu ya\" means…",a:"Where you fell is where your god pushed you",o:["Watch where you walk","Gods are cruel","Never fall"],f:"Look for the deeper cause of a misfortune."},
 {c:"Proverbs",q:"\"Nwata kwọọ aka, o soro okenye rie nri\" means…",a:"A child who washes his hands eats with elders",o:["Children should cook","Elders eat first","Wash after eating"],f:"It's the Igbo original of the proverb in Things Fall Apart."},
 {c:"Proverbs",q:"\"Mmadụ ka eji aga\" means…",a:"People are our strength",o:["Walk with care","Money is everything","Travel alone"],f:"Having people around you matters more than riches."},
 {c:"Proverbs",q:"\"Ezi aha ka ego\" (Igbo) means…",a:"A good name is better than money",o:["Money makes a name","Names are free","Change your name"],f:"Reputation is more valuable than riches."},
 {c:"Proverbs",q:"\"Orúkọ rere sàn ju wúrà àti fàdákà lọ\" (Yoruba) means…",a:"A good name is better than gold and silver",o:["Buy gold early","Names are cheap","Silver shines"],f:"Many Nigerian cultures share this value."},
 {c:"Proverbs",q:"\"Àìsí ńlé ológbò, ilé di ilé èkúté\" means…",a:"When the cat is away, the mice play",o:["Cats are lazy","Rats build houses","Keep pets indoors"],f:"Literally: without the cat, the house becomes the rats' house."},
 {c:"Proverbs",q:"Which animal is the trickster hero of many Nigerian folktales and proverbs?",a:"The tortoise",o:["The lion","The elephant","The goat"],f:"Ijapa (Yoruba) or Mbe (Igbo) is clever, greedy and often punished."},
 {c:"Proverbs",q:"In Yoruba folktales, the tortoise is called…",a:"Ìjàpá",o:["Ìgbín","Ẹkùn","Ọ̀bọ"],f:"Ìgbín is snail, Ẹkùn leopard, Ọ̀bọ monkey."},
 {c:"Proverbs",q:"In Igbo folktales, the tortoise is called…",a:"Mbe",o:["Agụ","Okuko","Enyi"],f:"Agụ is leopard, okuko chicken, enyi elephant."},
 {c:"Proverbs",q:"In Hausa folktales, the trickster is often the…",a:"Spider (Gizo)",o:["Lion","Camel","Horse"],f:"Gizo the spider plays the trickster role in Hausa tales."},
 {c:"Proverbs",q:"In the famous folktale, why does the tortoise's shell look cracked?",a:"He fell from the sky after a feast",o:["An elephant sat on him","He was born that way","He fought a lion"],f:"He tricked the birds at a sky feast, and they took back their feathers."},
 {c:"Proverbs",q:"In the sky-feast tale, the tortoise renamed himself…",a:"\"All of you\"",o:["\"King\"","\"Guest\"","\"Brother\""],f:"So when food was served \"for all of you\", he claimed it all."},
 {c:"Proverbs",q:"Yoruba storytelling sessions often begin with \"Àlọ́ o!\" and the audience replies…",a:"Àlọ́!",o:["Báwo ni!","Ẹ ṣé!","Ó dàbọ̀!"],f:"Àlọ́ means a folktale or riddle."},
 {c:"Proverbs",q:"\"Tatsuniya\" in Hausa refers to…",a:"Folktales",o:["Proverbs only","Songs","Prayers"],f:"Hausa storytellers often open with \"Ga ta nan, ga ta nanku!\""},
 {c:"Proverbs",q:"The Hausa word for proverb is…",a:"Karin magana",o:["Tatsuniya","Waka","Labari"],f:"Karin magana literally means \"bending of speech\"."},
 {c:"Proverbs",q:"The Igbo word for proverb is…",a:"Ilu",o:["Akụkọ","Egwu","Abụ"],f:"Akụkọ means story, abụ means song."},
 {c:"Proverbs",q:"The Yoruba word for proverb is…",a:"Òwe",o:["Oríkì","Àlọ́","Ewì"],f:"\"Òwe lẹṣin ọ̀rọ̀\": proverbs are the horses of words."},
 {c:"Proverbs",q:"In Things Fall Apart, the bird Eneke learned to fly without perching because…",a:"Men learned to shoot without missing",o:["Trees were cut down","It was too proud","The wind was strong"],f:"It's about adapting to changing times."},
 {c:"Proverbs",q:"In Things Fall Apart, \"Nneka\" means…",a:"Mother is supreme",o:["Father is king","God's gift","Child of the market"],f:"Uchendu explains it to Okonkwo during his exile in his mother's land."},
 {c:"Proverbs",q:"Achebe wrote: \"A toad does not run in the daytime for…\"",a:"Nothing",o:["Food","Fun","Water"],f:"Unusual behaviour always has a reason."},
 {c:"Proverbs",q:"In Things Fall Apart, \"If one finger brought oil…\"",a:"It soiled the others",o:["It cooked the soup","It lit the lamp","It healed the wound"],f:"One person's wrongdoing brings shame on the whole group."},
 {c:"Proverbs",q:"Achebe wrote: \"An old woman is always uneasy when dry bones are mentioned in…\"",a:"A proverb",o:["A song","The market","A dream"],f:"People feel uneasy when talk touches their weak spots."},
 {c:"Proverbs",q:"\"A man who pays respect to the great paves the way for…\"",a:"His own greatness",o:["His enemies","His children's wealth","A long journey"],f:"Okonkwo says this when he goes to ask Nwakibie for yam seeds."},
 {c:"Proverbs",q:"\"Looking at a king's mouth, one would think he never…\"",a:"Sucked at his mother's breast",o:["Ate yam","Went hungry","Spoke a lie"],f:"The powerful forget they were once small too."},
 {c:"Proverbs",q:"In Things Fall Apart, the clan is compared to a lizard because…",a:"If it lost its tail, it grew another",o:["It loved the sun","It lived in walls","It changed colour"],f:"The community survives losses and regrows."},
 {c:"Proverbs",q:"\"You can tell a ripe corn by…\"",a:"Its look",o:["Its smell","Its price","Its weight"],f:"Achebe uses it to say some things are obvious at a glance."},
 {c:"Proverbs",q:"In Arrow of God, \"The world is like a Mask dancing. If you want to see it well…\"",a:"You do not stand in one place",o:["Close your eyes","Dance along","Ask an elder"],f:"See things from different angles to understand them."},
 {c:"Proverbs",q:"In Arrow of God, wisdom is compared to…",a:"A goatskin bag that every man carries",o:["A river","A yam barn","A spear"],f:"Everyone carries their own wisdom."},
 {c:"Proverbs",q:"\"Unless the wind blows, we do not see the fowl's…\"",a:"Rump",o:["Eggs","Beak","Chicks"],f:"Hidden things are revealed when trouble comes. It's from Arrow of God."},
 {c:"Proverbs",q:"In Achebe's work, \"The man who carries a deity is not…\"",a:"A king",o:["A priest","A coward","A thief"],f:"Serving a god doesn't make you its master. It's from Arrow of God."},
 {c:"Proverbs",q:"\"Those whose palm-kernels were cracked for them by a benevolent spirit should not forget to be…\"",a:"Humble",o:["Rich","Grateful to the king","Quiet"],f:"Don't be proud if your success came easily."},
 {c:"Proverbs",q:"The proverb \"He who is being carried does not realise how far the town is\" means…",a:"Those who are helped don't appreciate the effort",o:["Walk instead of riding","Towns are far apart","Carry your own load"],f:"It's often quoted as a Nigerian proverb."},
 {c:"Proverbs",q:"\"A river that forgets its source will soon dry up\" warns against…",a:"Forgetting your roots",o:["Wasting water","Building dams","Fishing too much"],f:"It's a popular Yoruba saying."},
 {c:"Proverbs",q:"\"Ọ̀nà kan ò wọjà\" (Yoruba) means…",a:"There's more than one way to the market",o:["The market is closed","Only one road is safe","Shop early"],f:"There's always another way to reach a goal."},
 {c:"Proverbs",q:"\"Ẹni tí ó bá fẹ́ jẹ oyin inú àpáta kò ní wo ẹnu àáké\" means…",a:"Whoever wants something badly won't mind the cost",o:["Honey is sweet","Axes are sharp","Rocks are hard"],f:"Whoever wants honey from the rock won't worry about the axe's blade."},
 {c:"Proverbs",q:"\"Àgbà tí ó jẹ ajẹkù, yóò ru igbá rẹ̀ délé\" warns that a greedy elder…",a:"Will carry his own dishes home",o:["Will grow fat","Will be crowned","Will get sick"],f:"An elder who leaves nothing for the young won't get their help."},
 {c:"Proverbs",q:"\"Ilé ọba tó jó, ẹwà ló bù kún un\" means…",a:"Setbacks can lead to something better",o:["Kings' houses burn often","Fire is beautiful","Build with stone"],f:"A king's palace that burns is rebuilt more beautifully."},
 {c:"Proverbs",q:"\"Ẹyin lohùn; bí ó bá bọ́, kò ṣé kó\" means words are like eggs because…",a:"Once dropped, they can't be gathered back",o:["They are fragile and white","They feed people","They hatch into birds"],f:"Be careful what you say."},
 {c:"Proverbs",q:"\"Bí ọmọdé bá mọ ọwọ́ wẹ̀, á bá àgbà jẹun\" is the Yoruba version of which saying?",a:"A child who washes his hands eats with elders",o:["Too many cooks spoil the soup","Charity begins at home","Patience is a virtue"],f:"The Igbo and Yoruba share very similar proverbs."},
 {c:"Proverbs",q:"\"Abin da ka shuka, shi za ka girba\" (Hausa) means…",a:"You reap what you sow",o:["Farm early","Sell your harvest","Rain brings food"],f:"Whatever you plant is what you will harvest."},
 {c:"Proverbs",q:"\"Zomo ba ya kamuwa daga zaune\" (Hausa) means…",a:"You must make an effort to succeed",o:["Rabbits are fast","Sit and wait","Hunting is cruel"],f:"A hare isn't caught by someone sitting down."},
 {c:"Proverbs",q:"\"Rashin sani ya fi dare duhu\" (Hausa) means…",a:"Ignorance is darker than night",o:["Nights are dangerous","Sleep early","Light a lamp"],f:"Knowledge is light."},
 {c:"Proverbs",q:"\"Mai haƙuri yakan dafa dutse, har ya sha romonsa\" means a patient person…",a:"Can cook a stone and drink its broth",o:["Never eats","Waits forever","Cooks every day"],f:"With patience, even the impossible can be done."},
 {c:"Proverbs",q:"\"Kowa ya bar gida, gida ya bar shi\" (Hausa) means…",a:"Whoever abandons home, home abandons them",o:["Travel often","Build a new house","Stay with friends"],f:"Don't forget where you come from."},
 {c:"Proverbs",q:"\"Idan kunne ya ji, gangar jiki ta tsira\" (Hausa) means…",a:"If the ear listens, the body is saved",o:["Ears are big","Listen to music","The body is strong"],f:"Heeding warnings keeps you safe."},
 {c:"Proverbs",q:"\"Ƙaramin sani ƙuƙumi\" (Hausa) means…",a:"A little knowledge is dangerous",o:["Small things are cheap","Children are smart","Chains are strong"],f:"Knowing a little can trap you like a chain."},
 {c:"Proverbs",q:"\"Aka nri kwọọ aka ekpe, aka ekpe akwọọ aka nri\" (Igbo) means…",a:"We help each other",o:["Wash both hands","Use your right hand","Left-handed people are lucky"],f:"The right hand washes the left, and the left washes the right."},
 {c:"Proverbs",q:"The Igbo saying \"Ha ji mma, ji ji\" describes people who…",a:"Hold all the power",o:["Farm yams","Are good cooks","Sell knives"],f:"They hold both the knife and the yam."},
 {c:"Proverbs",q:"\"Agwọ loro ibe ya ka o ji eto\" (Igbo) means…",a:"A snake grows by swallowing another",o:["Snakes are dangerous","Never fight","Eat well"],f:"The powerful grow by overcoming rivals."},
 {c:"Proverbs",q:"\"Mmadụ ka e ji aga\" and \"Igwe bu ike\" both stress the value of…",a:"People and unity",o:["Money","Farming","Kingship"],f:"Igbo culture places great value on community."},
 {c:"Proverbs",q:"\"Ezi aha ka ego\" is closest in meaning to which Yoruba proverb?",a:"Orúkọ rere sàn ju wúrà àti fàdákà lọ",o:["Igi kan kì í dá igbó ṣe","Àìsí ńlé ológbò, ilé di ilé èkúté","Sùúrù ni baba ìwà"],f:"Both say a good name beats riches."},
 {c:"Proverbs",q:"\"Igi kan kì í dá igbó ṣe\" is closest in meaning to which Igbo saying?",a:"Igwe bu ike",o:["Ezi aha ka ego","Egbe bere, ugo bere","Ebe onye dara ka chi ya kwaturu ya"],f:"Both are about strength in numbers."},
 {c:"Proverbs",q:"\"Àìsí ńlé ológbò, ilé di ilé èkúté\" is closest to which English proverb?",a:"When the cat's away, the mice will play",o:["Curiosity killed the cat","Let sleeping dogs lie","A cat has nine lives"],f:"Yoruba and English share this one."},
 {c:"Proverbs",q:"\"Who no know go know\" was the title of a famous song by…",a:"Fela Kuti",o:["2Face Idibia","King Sunny Adé","Davido"],f:"It's the title track of a 1975 Fela album, and the phrase is now an everyday warning."},
 {c:"Proverbs",q:"Fela's song \"Shakara\" mocks people who…",a:"Show off and make empty noise",o:["Work too hard","Eat too much","Sleep in church"],f:"\"Shakara\" means showing off or empty boasting."},
 {c:"Proverbs",q:"Fela's \"Water No Get Enemy\" means…",a:"Everyone needs water, so it has no enemies",o:["Water is dangerous","Don't drink water","Rivers flood"],f:"It's often used to mean something everyone needs."},
 {c:"Proverbs",q:"\"Wetin go round go come around\" means…",a:"What you do comes back to you",o:["Roads are circular","Return what you borrow","Travel in circles"],f:"It's a Pidgin version of \"what goes around comes around\"."},
 {c:"Proverbs",q:"\"Na from small, dem dey take know big\" means…",a:"Big things show signs early",o:["Small is beautiful","Big is better","Children are small"],f:"Similar to the proverb about the chick that becomes a cock."},
 {c:"Proverbs",q:"In Igbo belief, \"chi\" is…",a:"A person's personal god or guiding spirit",o:["A market day","A type of yam","A wedding gift"],f:"Many Igbo names contain \"Chi\"."},
 // ===== NEW: PEOPLES =====
 {c:"Peoples",q:"Which are usually named as Nigeria's three largest ethnic groups?",a:"Hausa-Fulani, Yoruba and Igbo",o:["Tiv, Ijaw and Kanuri","Edo, Efik and Nupe","Igala, Idoma and Ibibio"],f:"Together they make up well over half the population."},
 {c:"Peoples",q:"Roughly how many ethnic groups live in Nigeria?",a:"More than 250",o:["About 10","About 50","Exactly 36"],f:"Some estimates put the number above 300."},
 {c:"Peoples",q:"The Yoruba trace their origins to which ancient city?",a:"Ile-Ife",o:["Oyo","Lagos","Ibadan"],f:"Ile-Ife is seen as the spiritual cradle of the Yoruba."},
 {c:"Peoples",q:"In Yoruba tradition, the ancestor of the Yoruba kings is…",a:"Oduduwa",o:["Sango","Ogun","Oranmiyan"],f:"Many Yoruba kings trace their lineage to Oduduwa."},
 {c:"Peoples",q:"The Yoruba homeland is mainly in which part of Nigeria?",a:"The south-west",o:["The north-east","The south-east","The Middle Belt"],f:"Yoruba people also live in Benin and Togo."},
 {c:"Peoples",q:"Apart from Nigeria, large Yoruba-speaking communities live in…",a:"Benin and Togo",o:["Kenya and Uganda","Chad and Sudan","Ghana and Senegal only"],f:"Yoruba culture also spread to Brazil and Cuba through the slave trade."},
 {c:"Peoples",q:"Yoruba religion survives in Brazil and Cuba as…",a:"Candomblé and Santería",o:["Voodoo and Islam","Rastafari and Hinduism","Shinto and Taoism"],f:"Yoruba deities (orisha) are still worshipped across the Americas."},
 {c:"Peoples",q:"The Igbo homeland is mainly in…",a:"The south-east",o:["The north-west","The south-west","The far north"],f:"Abia, Anambra, Ebonyi, Enugu and Imo are majority Igbo states."},
 {c:"Peoples",q:"Which five states are usually called the Igbo states?",a:"Abia, Anambra, Ebonyi, Enugu, Imo",o:["Delta, Edo, Rivers, Bayelsa, Imo","Enugu, Benue, Kogi, Anambra, Abia","Imo, Rivers, Cross River, Abia, Enugu"],f:"Igbo communities also live in Delta and Rivers States."},
 {c:"Peoples",q:"The Nri kingdom is important in Igbo history because it was…",a:"A religious and cultural centre",o:["A Hausa trading city","A coastal fort","A colonial capital"],f:"The Eze Nri was a priest-king whose influence spread across Igboland."},
 {c:"Peoples",q:"The Hausa homeland is mainly in…",a:"Northern Nigeria",o:["The Niger Delta","The south-west","The south-east"],f:"Hausa is also widely spoken across West Africa."},
 {c:"Peoples",q:"The seven original Hausa states are known as the…",a:"Hausa Bakwai",o:["Banza Bakwai","Kanem-Bornu","Sokoto Caliphate"],f:"They include Kano, Katsina, Daura, Zazzau, Gobir, Rano and Biram."},
 {c:"Peoples",q:"Which city is NOT one of the Hausa Bakwai?",a:"Ilorin",o:["Kano","Katsina","Daura"],f:"Ilorin is a Yoruba-speaking emirate."},
 {c:"Peoples",q:"The Fulani are traditionally known as…",a:"Cattle herders",o:["Fishermen","Boat builders","Miners"],f:"Many Fulani also became scholars, rulers and city dwellers."},
 {c:"Peoples",q:"The Fulani language is called…",a:"Fulfulde",o:["Hausa","Kanuri","Tiv"],f:"It's spoken across the Sahel, from Senegal to Sudan."},
 {c:"Peoples",q:"The Kanuri are the main ethnic group of which state?",a:"Borno",o:["Kano","Sokoto","Kwara"],f:"They built the Kanem-Bornu Empire."},
 {c:"Peoples",q:"The Tiv trace their descent from an ancestor named…",a:"Tiv",o:["Oduduwa","Eri","Bayajidda"],f:"His sons Ichongo and Ipusu are said to be the two main Tiv branches."},
 {c:"Peoples",q:"The Ijaw are among the oldest inhabitants of…",a:"The Niger Delta",o:["Lagos Island","Lake Chad","The Mandara Mountains"],f:"They are famous as fishermen and traders on the creeks."},
 {c:"Peoples",q:"The Kalabari are a subgroup of which people?",a:"The Ijaw",o:["The Yoruba","The Hausa","The Tiv"],f:"Their towns include Buguma, Abonnema and Degema."},
 {c:"Peoples",q:"The Edo people are mainly found in…",a:"Edo State",o:["Ogun State","Kano State","Ebonyi State"],f:"Benin City is their historic capital."},
 {c:"Peoples",q:"The Esan and Etsako peoples are found in…",a:"Edo State",o:["Ondo State","Kaduna State","Rivers State"],f:"Edo State is home to several closely related groups."},
 {c:"Peoples",q:"The Ibibio live mainly in…",a:"Akwa Ibom State",o:["Imo State","Lagos State","Niger State"],f:"They're the largest group in Akwa Ibom."},
 {c:"Peoples",q:"The Annang people live mainly in…",a:"Akwa Ibom State",o:["Cross River State","Ogun State","Kogi State"],f:"Ikot Ekpene is a key Annang town, famous for raffia crafts."},
 {c:"Peoples",q:"The Efik people are centred around…",a:"Calabar",o:["Uyo","Ikom","Ogoja"],f:"They were famous traders on the Calabar River."},
 {c:"Peoples",q:"The Igala live mainly in which state?",a:"Kogi",o:["Kwara","Enugu","Plateau"],f:"Their king, the Attah, sits at Idah."},
 {c:"Peoples",q:"The Idoma live mainly in which state?",a:"Benue",o:["Nasarawa","Kogi","Plateau"],f:"Otukpo is their main town."},
 {c:"Peoples",q:"The Ebira live mainly in which state?",a:"Kogi",o:["Kano","Ondo","Bauchi"],f:"Okene is the main Ebira town."},
 {c:"Peoples",q:"The Urhobo live mainly in which state?",a:"Delta",o:["Edo","Bayelsa","Ondo"],f:"Ughelli and Sapele are major Urhobo towns."},
 {c:"Peoples",q:"The Isoko live mainly in which state?",a:"Delta",o:["Rivers","Lagos","Kogi"],f:"They are close neighbours of the Urhobo."},
 {c:"Peoples",q:"The Itsekiri are centred around which city?",a:"Warri",o:["Asaba","Sapele","Yenagoa"],f:"Their king is the Olu of Warri."},
 {c:"Peoples",q:"The Itsekiri language is most closely related to…",a:"Yoruba",o:["Hausa","Igbo","Ijaw"],f:"Itsekiri and Yoruba share many words."},
 {c:"Peoples",q:"The Ogoni live in which state?",a:"Rivers",o:["Bayelsa","Akwa Ibom","Delta"],f:"Ken Saro-Wiwa was an Ogoni leader."},
 {c:"Peoples",q:"The Ikwerre people live mainly in…",a:"Rivers State",o:["Imo State","Anambra State","Delta State"],f:"Much of Port Harcourt sits on Ikwerre land."},
 {c:"Peoples",q:"The Berom are the largest indigenous group of…",a:"The Jos Plateau",o:["The Niger Delta","Lagos","Sokoto"],f:"Their paramount ruler is the Gbong Gwom Jos."},
 {c:"Peoples",q:"The Jukun are associated with which historic kingdom?",a:"Kwararafa",o:["Oyo","Benin","Nri"],f:"Wukari in Taraba is their main centre."},
 {c:"Peoples",q:"The Gwari (Gbagyi) are among the original inhabitants of…",a:"The Abuja area",o:["Lagos Island","Calabar","Kano city"],f:"Many Gbagyi communities were resettled when Abuja was built."},

    freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.8})}catch(e){}
}

/* ---------- confetti (green-white-green) ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue("--accent").trim(),"#FFFFFF",cs.getPropertyValue("--accent").trim(),cs.getPropertyValue("--danfo").trim()];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:5+Math.random()*6,r:Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle="rgba(0,0,0,.25)";x.lineWidth=.5;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<180)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

    }
    if(!db||!me){copyText(text);msg.textContent="We couldn't send it from here, so the report was copied. Paste it to the game's creator.";return}
    btn.disabled=true;btn.textContent="Sending…";
    try{const ref=db.collection("reports").doc(me);const snap=await ref.get();const items=(snap.exists&&snap.data().items)||[];items.push({c:x.c,q:x.q,a:x.a,reason,note,at:Date.now()});await ref.set({items:items.slice(-50),last:Date.now()});box.innerHTML=`<p class="muted" style="margin:0">Thank you! Your report was sent.</p>`}

async function postScore(){
  if(!db||!me)return "off";
  const name=(nick||"Anonymous").slice(0,24);
  try{
    if(run.mode==="daily"){
      await db.collection("daily").doc(me).set({nick:name,date:today,correct:run.correct,points:run.points,grid:run.grid,streak:currentStreak(),at:Date.now()});
      return "saved";

  }catch(e){return "failed"}

function dailyQuestions(){
  const r=rng(hashStr("naija-daily-"+today));
  const cats=shuffle(CATS.map(c=>c.id),r).slice(0,LEN);
  return cats.map(cid=>{const pool=Q.filter(x=>x.c===cid);const x=pool[Math.floor(r()*pool.length)];return {...x,opts:shuffle([x.a,...x.o],r)}});
}
function freeQuestions(cat){
  const pool=cat==="All"?Q:Q.filter(x=>x.c===cat);
  const key=cat;let s=new Set(seen[key]||[]);
  let fresh=pool.filter(x=>!s.has(x.q));
  if(fresh.length<LEN){s=new Set();fresh=pool}
  const pick=shuffle(fresh).slice(0,LEN);
  pick.forEach(x=>s.add(x.q));seen[key]=[...s];store.set("naija-seen",seen);
  return pick.map(x=>({...x,opts:shuffle([x.a,...x.o])}));
}
